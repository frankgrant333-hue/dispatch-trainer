<style>
  :root{--bg:#0d1321;--card:#1d2d44;--accent:#3e7cb1;--good:#5cb85c;--bad:#d9534f;--ink:#f0ebd8;--dim:#aab8c8;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:24px;}
  .wrap{max-width:860px;margin:0 auto;}
  h1{font-size:1.5rem;margin-bottom:4px;} .sub{color:var(--dim);margin-bottom:20px;font-size:.9rem;}
  .card{background:var(--card);border-radius:10px;padding:20px;margin-bottom:16px;}
  button{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:10px 18px;font-size:1rem;cursor:pointer;margin:4px;}
  button:hover{filter:brightness(1.15);}
  button.level{width:100%;text-align:left;padding:14px;margin:6px 0;}
  button.level small{display:block;color:#dce6f0;font-weight:normal;margin-top:2px;}
  pre.paper{background:#0a0f1a;border:1px solid #33415c;border-radius:8px;padding:14px;overflow-x:auto;font-size:.82rem;line-height:1.5;color:#9fd6a0;white-space:pre-wrap;margin:10px 0;}
  .qnum{color:var(--dim);font-size:.8rem;margin-bottom:4px;}
  .qtext{font-size:1.05rem;margin-bottom:12px;line-height:1.45;}
  .opt{display:block;width:100%;text-align:left;background:#2b3f5c;margin:6px 0;padding:12px;border-radius:6px;border:2px solid transparent;color:var(--ink);font-size:.95rem;cursor:pointer;line-height:1.4;}
  .opt:hover{border-color:var(--accent);}
  .opt.sel{border-color:var(--accent);background:#34507a;}
  .opt.correct{border-color:var(--good);background:#1e3d27;}
  .opt.wrong{border-color:var(--bad);background:#41201f;}
  .exp{background:#11203a;border-left:4px solid var(--accent);padding:12px;border-radius:0 6px 6px 0;margin-top:10px;font-size:.9rem;line-height:1.5;color:var(--dim);}
  .exp b{color:var(--ink);}
  .bar{height:8px;background:#33415c;border-radius:4px;margin:10px 0 18px;}
  .bar div{height:100%;background:var(--accent);border-radius:4px;transition:width .3s;}
  .score{font-size:2.2rem;font-weight:bold;}
  .pass{color:var(--good);} .fail{color:var(--bad);}
  .topic{display:inline-block;background:#33415c;color:var(--dim);border-radius:12px;padding:2px 10px;font-size:.72rem;margin-bottom:8px;}
  .hist{font-size:.85rem;color:var(--dim);margin-top:8px;}
</style>

{lv:1,topic:"Weather",q:"TAFs are routinely issued:",o:["Every 6 hours (00/06/12/18Z), valid 24 or 30 hours","Hourly, valid 12 hours","Every 3 hours, valid 24 hours"],a:0,exp:"TAFs come out 4× daily at 0000, 0600, 1200, 1800Z, valid 24 hours (30 at major hubs like DFW). METARs are the hourly product.",ref:"AC 00-45H"},
{lv:1,topic:"Weather",q:"The mature stage of a thunderstorm begins when:",o:["Lightning is first observed","Precipitation begins falling from the cloud base and reaches the surface","The anvil top forms"],a:1,exp:"Cumulus (updrafts) → <b>mature begins when precip reaches the surface</b>; updrafts AND downdrafts coexist — most hazardous stage → dissipating (downdrafts).",ref:"AC 00-6B"},
{lv:1,topic:"Performance",q:"An area beyond the runway end, free of obstructions, that may be used when computing accelerate-go takeoff performance is a:",o:["Stopway","Clearway","Blast pad"],a:1,exp:"<b>Clearway</b> = obstruction-free area beyond the runway used for the airborne portion to the 35-ft screen. A <b>stopway</b> is paved overrun usable only for the accelerate-STOP case.",ref:"14 CFR 1.1"},
{lv:1,topic:"Fuel",q:"Minimum fuel for a domestic dispatch (121.639): fly to destination, then to the most distant required alternate, then:",o:["30 minutes at holding speed at 1,500 ft","45 minutes at normal cruising fuel consumption","10% of total flight time"],a:1,exp:"<b>121.639:</b> destination + most distant alternate + <b>45 min at normal cruise consumption</b>. The 10%-plus-30-min formula is the FLAG rule (121.645).",ref:"121.639"},
{lv:1,topic:"W&B",q:"An airplane loaded with the CG at the aft limit has:",o:["Lowest stall speed, highest cruise speed, least stability","Highest stall speed, highest cruise speed, most stability","Lowest stall speed, lowest cruise speed, most stability"],a:0,exp:"Aft CG → less tail-down force needed → less induced drag and lower stall speed, faster cruise — but the airplane is <b>least stable</b>. Forward CG is the opposite.",ref:"PHAK Ch.10"},
{lv:1,topic:"Regs",q:"A dispatcher declares an emergency and a deviation from regulations results. The written report is sent through the air carrier's operations manager to the FAA Administrator within:",o:["48 hours","10 days of the event","7 days, by the PIC only"],a:1,exp:"<b>121.557(d):</b> when a dispatcher declares the emergency, the report goes through the operations manager to the Administrator <b>within 10 days of the event</b>.",ref:"121.557"},
{lv:1,topic:"Regs",q:"Below what altitude are non-safety-related cockpit activities prohibited (except cruise flight)?",o:["FL180","14,500 ft","10,000 ft"],a:2,exp:"<b>Sterile cockpit rule, 121.542:</b> critical phases of flight = all ground ops involving taxi/takeoff/landing and flight below <b>10,000 ft</b> except cruise.",ref:"121.542"},
{lv:1,topic:"Routes",q:"Where is the list of routes requiring special navigation equipment maintained?",o:["International Flight Information Manual","The air carrier's Operations Specifications","The Airplane Flight Manual"],a:1,exp:"<b>Operations Specifications</b> (OpSpecs) define authorized routes/areas and required special nav equipment for that certificate holder.",ref:"121.103/.121"},
{lv:1,topic:"Weather",q:"Where are jet streams normally located?",o:["In breaks in the tropopause where intensified temperature gradients are located","In strong surface low-pressure systems","In one continuous band encircling the Earth"],a:0,exp:"Jet streams sit in <b>tropopause breaks</b> with the strongest temperature gradients; segmented, stronger in winter. CAT is strongest on the polar side / upper trough.",ref:"AC 00-6B"},
{lv:1,topic:"Regs",q:"Engine shutdown on a domestic two-engine turbojet en route. The PIC must:",o:["Continue to destination if the dispatcher approves","Land at the nearest suitable airport, in point of time, where a safe landing can be made","Continue if as safe as diverting"],a:1,exp:"<b>121.565:</b> 2-engine = land at nearest suitable airport in point of time. Only 3+ engine aircraft with one out may continue when as safe as landing at nearest suitable.",ref:"121.565"},
// ---- LEVEL 2 ----
{lv:2,topic:"Alternates",q:"KMCO TAF for your 2310Z ETA: FM2200 14008KT 5SM BR OVC025 (field elev 96 ft). Per 121.619, a destination alternate is:",o:["Not required — ceiling ≥2,000 ft AGL and visibility ≥3 SM for the window","Required — visibility below 6 SM","Required — any BR (mist) in the TAF mandates one"],a:0,exp:"<b>1-2-3 rule (121.619):</b> 1 hr before/after ETA, need ceiling ≥2,000 ft above field and vis ≥3 SM. OVC025 = 2,500 AGL ✓, 5SM ✓ → no alternate required.",ref:"121.619"},
{lv:2,topic:"Alternates",q:"Alternate candidate has ONE usable ILS: DA 200 / vis 1/2. OpSpec C055 derived alternate minimums:",o:["600 ft – 1 1/2 SM","400 ft – 1 SM","200 ft – 2 SM"],a:0,exp:"One usable approach: <b>add 400 ft to the DA/MDA and 1 SM to the vis</b>. 200+400 = 600 ft; 1/2+1 = 1 1/2 SM → 600-1½.",ref:"OpSpec C055"},
{lv:2,topic:"Alternates",q:"Departure airport weather is below CAT I landing minimums but at takeoff minimums. A two-engine aircraft requires a takeoff alternate located within:",o:["1 hour at normal cruise speed, still air, one engine inoperative","2 hours at normal cruise speed, still air, one engine inoperative","30 minutes at normal cruise, all engines operating"],a:0,exp:"<b>121.617:</b> 2 engines → 1 hour; 3+ engines → 2 hours, at normal cruise, still air, single engine inoperative.",ref:"121.617"},
{lv:2,topic:"Weights",q:"B738: structural MTOW 174,200 · runway-limit 169,400 · climb-limit 172,000 · MLW 146,300 · trip burn 11,200 · MZFW 138,300 · fuel 24,000. Max allowable takeoff weight:",o:["157,500 lb","162,300 lb","169,400 lb"],a:0,exp:"Check every limit, lowest wins. Landing-limited TOW = MLW 146,300 + burn 11,200 = <b>157,500</b>. ZFW-limited = 138,300+24,000 = 162,300. Runway 169,400. Lowest = 157,500.",ref:"121.195/.189"},
{lv:2,topic:"Regs",q:"RVR 1600 is prescribed but not reported. The ground visibility you may substitute is:",o:["1/4 SM","1/2 SM","3/4 SM"],a:0,exp:"RVR 16 ≈ <b>1/4 SM</b>. Memorize: RVR 24=1/2, 32=5/8, 40=3/4, 50=1, 60=1¼ SM.",ref:"91.175/OpSpecs"},
{lv:2,topic:"Fuel",q:"Burn DFW→MCO 13,800 · alternate TPA 2,900 · 45-min reserve 4,100 · taxi 600 (lb). Minimum release fuel:",o:["20,800 lb","21,400 lb","18,500 lb"],a:1,exp:"600 + 13,800 + 2,900 + 4,100 = <b>21,400 lb</b>. Domestic formula: taxi + destination + most distant alternate + 45-min reserve.",ref:"121.639"},
{lv:2,topic:"Performance",q:"Dispatching a turbojet: at the planned destination it must be able to make a full-stop landing within:",o:["70% of the effective runway length","60% of the effective runway length","85%, or 115% when wet"],a:1,exp:"<b>121.195(b):</b> turbojet = 60% of effective runway length (turboprop = 70%). Forecast wet/slippery adds a 115% factor on top (121.195(d)).",ref:"121.195"},
{lv:2,topic:"Performance",q:"Destination runways forecast WET at the ETA. The required effective runway length versus dry is:",o:["Unchanged if the runway is grooved","115% of the dry requirement","The 60% factor becomes 50%"],a:1,exp:"<b>121.195(d):</b> wet/slippery forecast → required landing runway length is <b>115%</b> of the dry figure (unless AFM-approved shorter wet data per OpSpecs).",ref:"121.195(d)"},
{lv:2,topic:"Regs",q:"A domestic flight is delayed on the ground at an intermediate airport. A redispatch (amended) release is required when the delay exceeds:",o:["1 hour","2 hours","6 hours"],a:0,exp:"<b>121.631(b):</b> may not allow a domestic flight to depart an intermediate airport more than <b>1 hour</b> behind schedule without redispatch through proper channels.",ref:"121.631"},
{lv:2,topic:"Weather",q:"Winds-aloft (FB) group 731960 at FL390 decodes as:",o:["230° true / 119 kt / −60°C","730° — invalid entry","130° / 19 kt / +60°C"],a:0,exp:"First pair >50 → subtract 50 (73−50=23 → 230°) and add 100 to speed (19+100=119 kt). Temps above FL240 are always negative → −60°C.",ref:"AC 00-45H"},
{lv:2,topic:"Routes",q:"A MOCA (shown with *) guarantees obstacle clearance along the entire segment but acceptable VOR navigation signal coverage only within:",o:["22 NM of the VOR","25 SM of the VOR","The full segment, same as MEA"],a:0,exp:"<b>MOCA:</b> obstacle clearance everywhere on the segment, nav signal assured only within <b>22 NM</b> of the VOR. MEA assures both for the whole segment.",ref:"AIM 5-3-5"},
{lv:2,topic:"Weather",q:"Convective SIGMETs are issued for:",o:["Moderate turbulence and surface winds ≥30 kt","Embedded thunderstorms, lines of thunderstorms, hail ≥3/4 in, surface winds ≥50 kt, tornadoes","Severe icing not associated with thunderstorms"],a:1,exp:"<b>WST:</b> embedded TS, lines, ≥40% area coverage, winds ≥50 kt, hail ≥3/4\", tornadoes — and it <b>implies</b> severe turbulence, severe icing, and LLWS. The other two answers are AIRMET Tango and SIGMET items.",ref:"AC 00-45H"},
{lv:2,topic:"Alternates",q:"Which condition DISQUALIFIES an airport from being listed as an alternate?",o:["Weather reporting is by AWOS-3","The NAVAID for the final approach is unmonitored","The airport sits next to a restricted area"],a:1,exp:"An <b>unmonitored final-approach NAVAID</b> makes the approach unusable for alternate planning. AWOS-3 reporting is acceptable.",ref:"ADX bank / OpSpec C055"},
// ---- LEVEL 3 (scenario s1) ----
{lv:3,sc:"s1",topic:"Alternates",q:"Is a destination alternate required for KBOS?",o:["No — visibility 3SM meets the 1-2-3 rule","Yes — the forecast ceiling of 800 ft AGL is below 2,000 ft","Only if the TEMPO condition verifies"],a:1,exp:"1-2-3 needs BOTH ceiling ≥2,000 AGL and vis ≥3SM for ETA ±1 hr. OVC008 = 800 ft → fails → alternate required (121.619).",ref:"121.619"},
{lv:3,sc:"s1",topic:"Regs",q:"The TEMPO at KBOS drops vis to 1 1/2SM; lowest CAT I minimum is RVR 1800 (≈3/8SM — TEMPO is actually above it). But suppose TEMPO were BELOW landing minimums. Under Exemption 3585 the dispatch is:",o:["Illegal — conditional language below minimums always grounds the flight","Legal if the main forecast body is at/above minimums, the conditional meets the exemption's limits, and a SECOND alternate is listed with fuel to the most distant","Legal with captain's concurrence alone"],a:1,exp:"<b>Exemption 3585</b> (held by AA): conditional language below mins is tolerable within limits when the main body is at/above mins, a second alternate is added, and fuel covers the most distant alternate.",ref:"Exemption 3585"},
{lv:3,sc:"s1",topic:"Alternates",q:"KPVD derived alternate minimums (two ILS to different runways, both 200-1/2):",o:["600 – 1 1/2","400 – 1","200 – 1/2 as published"],a:1,exp:"Two+ facilities/straight-in approaches to different suitable runways: add <b>200 ft</b> and <b>1/2 SM</b> to the HIGHER of the two: 200+200=400, 1/2+1/2=1 → <b>400-1</b>. PVD forecast 1,200 ft/4SM qualifies.",ref:"OpSpec C055"},
{lv:3,sc:"s1",topic:"Alternates",q:"KBDL — glideslope unmonitored on its only usable ILS. As an alternate KBDL is:",o:["Usable — its AWOS covers monitoring","Not eligible while the NAVAID is unmonitored","Usable if minimums are raised to 800-2"],a:1,exp:"Unmonitored final-approach NAVAID → approach can't be relied on for planning → airport <b>not eligible</b> as alternate. Watch NOTAMs for this trap.",ref:"OpSpec C055"},
{lv:3,sc:"s1",topic:"Performance",q:"MEL anti-skid INOP most directly penalizes:",o:["Climb-limit weight","Accelerate-stop (field length) and landing distance limits","Zero fuel weight"],a:1,exp:"No anti-skid = much longer stopping distance → big hits to <b>accelerate-stop/V1 and landing distance</b>, possibly takeoff-weight and landing-weight limits on short runways.",ref:"MEL/AFM"},
{lv:3,sc:"s1",topic:"Fuel",q:"Using the fuel figures with KBDL replaced by a legal second alternate at the same burn (2,800): minimum release fuel (taxi + burn + most distant altn + reserve):",o:["16,400 lb","17,000 lb","19,200 lb"],a:1,exp:"500 + 9,600 + 2,800 (most distant) + 4,100 = <b>17,000 lb</b>. With two alternates you fuel to the MOST DISTANT one, not both.",ref:"121.639 / Ex.3585"},
{lv:3,sc:"s1",topic:"Regs",q:"ETA 1554Z — the 121.619 weather-evaluation window is:",o:["1454Z to 1654Z","1430Z to 1554Z","1554Z to 1754Z"],a:0,exp:"One hour before to one hour after the ETA: <b>1454–1654Z</b>. The TEMPO 1500/1800 group sits inside it — that's why it matters.",ref:"121.619"},
{lv:3,sc:"s1",topic:"Weather",q:"PIREP: UA/OV BOS/TM 1450/FL080/TP B738/SK OVC TOP 065/TB MOD/IC LGT-MOD RIME 060-080. Cloud tops are:",o:["8,000 ft","6,500 ft","Unknown — tops not reported"],a:1,exp:"/SK OVC <b>TOP 065</b> = tops 6,500 ft. FL080 is just the altitude the report was made from. PIREPs are your only real source of tops and actual icing.",ref:"AC 00-45H"},
{lv:3,sc:"s1",topic:"Regs",q:"After dispatch, KBOS goes below minimums while AA1567 is en route. The dispatcher's primary regulatory action:",o:["Issue amended dispatch information / re-dispatch to a new destination (121.627, 121.631)","Tell the crew to hold until weather improves, indefinitely","Declare an emergency on the flight's behalf"],a:0,exp:"<b>121.627:</b> can't continue toward a destination where landing can't be made safely — the fix is <b>amended release/redispatch</b>. Dispatcher monitors and acts (121.533).",ref:"121.627/.631"},
{lv:3,sc:"s1",topic:"Weather",q:"KBOS wind 04015G25KT, landing ILS RWY 4R (course ~037°). The wind is essentially:",o:["A direct crosswind — check the limit","Right down the runway — a headwind with gusts","A quartering tailwind"],a:1,exp:"Wind FROM 040° on runway heading ~037° = headwind. Good for performance (max 50% headwind credit in the data); gusts still matter for stability/windshear judgment.",ref:"Performance basics"},
// ---- LEVEL 3 (scenario s2) ----
{lv:3,sc:"s2",topic:"Alternates",q:"Is an alternate required for KSFO?",o:["Yes — both ceiling (600 AGL) and visibility (2SM) bust the 1-2-3 rule","No — the ILS gets you to 200 ft anyway","Only because of the MEL item"],a:0,exp:"OVC006/2SM at ETA: ceiling <2,000 ✗ AND vis <3SM ✗ → alternate definitely required (121.619). Approach capability is irrelevant to whether the RULE triggers.",ref:"121.619"},
{lv:3,sc:"s2",topic:"Alternates",q:"KOAK (single usable ILS, DA 213/ vis 1/2; TAF BKN009 OVC014, 5SM). Derived minimums and legality:",o:["613 ft – 1 1/2 SM → forecast 900 BKN... use the OVC: 1,400 ✓, 5SM ✓ — legal","413 – 1 → legal automatically","613 – 1 1/2 → illegal, ceiling busts"],a:0,exp:"One approach: add 400/1 → <b>613 – 1½</b>. Controlling ceiling: lowest BKN/OVC = BKN009 = 900 ft ✓ (>613), vis 5 ✓ → KOAK is legal. (Careful: BKN counts as a ceiling!)",ref:"OpSpec C055"},
{lv:3,sc:"s2",topic:"Weights",q:"Max allowable takeoff weight tonight:",o:["189,600 lb","191,500 lb","193,100 lb"],a:0,exp:"Candidates: structural 196,000; runway 191,500; climb 194,000; <b>MLW+burn = 174,200+15,400 = 189,600</b>; ZFW+fuel = 165,300+27,800 = 193,100. Lowest = <b>189,600</b> (landing-limited).",ref:"121.189/.195"},
{lv:3,sc:"s2",topic:"Fuel",q:"Minimum release fuel with KSMF as the listed (most distant) alternate:",o:["23,400 lb","20,200 lb","19,600 lb"],a:0,exp:"taxi 600 + burn 15,400 + SMF 3,100 + reserve 4,300 = <b>23,400 lb</b>.",ref:"121.639"},
{lv:3,sc:"s2",topic:"Routes",q:"PHX→SFO crosses high terrain. 121.191 requires the dispatch weight to allow, engine-out, EITHER positive slope at 1,000 ft above terrain within 5 SM of track, OR:",o:["Driftdown clearing terrain within 5 SM of track by 2,000 ft with positive slope at 1,500 ft above the diversion airport","Maintaining cruise altitude on one engine to destination","Climb to FL250 minimum on one engine"],a:0,exp:"<b>121.191(a)(2):</b> the driftdown option — net flight path clears terrain/obstacles within 5 SM by <b>2,000 ft vertically</b>, positive slope at 1,500 ft over the landing airport. Fuel dump credit allowed.",ref:"121.191"},
{lv:3,sc:"s2",topic:"Weather",q:"KSFO OVC006 with 2SM BR overnight — classic mechanism:",o:["Advection fog: marine air moving over the cool coastal surface","Radiation fog: requires the strong daytime heating of the Bay","Steam fog from the Pacific"],a:0,exp:"SFO's signature stratus/fog = <b>advection</b>: moist Pacific air flowing over cold coastal water/land. Radiation fog needs clear, calm nights over land; steam fog needs cold air over warm water.",ref:"AC 00-6B"},
{lv:3,sc:"s2",topic:"Regs",q:"AA2244's release must contain all of the following EXCEPT:",o:["Minimum fuel supply","Trip number and aircraft identification number","The names of all cabin crewmembers"],a:2,exp:"<b>121.687:</b> release contains aircraft ID, trip number, airports (dep/intermediate/dest/alternates), type of operation, minimum fuel, weather reports/forecasts. Cabin crew names are not release items.",ref:"121.687"},
{lv:3,sc:"s2",topic:"Regs",q:"Who must sign/concur before AA2244 departs?",o:["The PIC only","Both the PIC and the aircraft dispatcher","The dispatcher and the station manager"],a:1,exp:"<b>121.663:</b> PIC and dispatcher both sign the release only if both believe the flight can be made safely. Signing authority can be delegated; dispatch authority cannot.",ref:"121.663"},
{lv:3,sc:"s2",topic:"Performance",q:"If SFO requires a lower flap setting for the climb-limit weight, the trade-off is:",o:["Shorter ground roll and better climb","Longer takeoff ground run but a better climb gradient","No effect on field length"],a:1,exp:"Less flap = less drag = <b>better climb gradient</b> but less lift at low speed = <b>longer runway needed</b>. More flap is the reverse. Classic field-vs-climb trade.",ref:"Performance basics"},
{lv:3,sc:"s2",topic:"Weather",q:"ETA 0403Z at SFO = local time (PDT, UTC−7):",o:["9:03 PM same evening","11:03 PM","7:03 PM"],a:0,exp:"0403Z − 7 = 2103 local = <b>9:03 PM</b> the previous calendar evening. Zulu↔local conversion shows up constantly — know your zones (PDT −7, MST −7, CDT −5, EDT −4).",ref:"Geography/time"}
];
// ---------------- AA REAL-EXAM DRILL BANK (from real hiring-test reports) ----------------
const AABANK=[
// ---- Weight Chain fill-ins (ref 13, added 2026-08-03) ----
{"cat": "Weight Chain", "q": "The Empty Operating Weight (EOW) is the basic weight of the aircraft plus ________, but no ________.", "o": ["crew, fluids, and essential equipment / fuel or payload", "fuel and cargo / passengers", "passengers and bags / crew"], "a": 0, "exp": "<b>EOW = airframe + crew + fluids + essential equipment</b> — the airplane ready to work, before any fuel or revenue load goes on.", "ref": "Ref 13"},
{"cat": "Weight Chain", "q": "Payload is the total weight of ________.", "o": ["the aircraft minus all fuel", "revenue-generating items: passengers, luggage, and cargo", "everything loaded after pushback"], "a": 1, "exp": "<b>Payload = what pays: pax + bags + cargo.</b> Crew and catering are NOT payload — they're inside EOW.", "ref": "Ref 13"},
{"cat": "Weight Chain", "q": "Zero Fuel Weight equals ________ plus ________.", "o": ["MTOW / reserves", "EOW / usable fuel", "EOW / payload"], "a": 2, "exp": "<b>ZFW = EOW + payload</b> — the entire aircraft and contents EXCLUDING usable fuel. First link of the chain.", "ref": "Ref 13"},
{"cat": "Weight Chain", "q": "Exceeding the Maximum Zero Fuel Weight strains the ________.", "o": ["wing roots where they join the fuselage", "nose gear attachment", "aft pressure bulkhead"], "a": 0, "exp": "Fuel carried IN the wings bends them down and relieves the root; body weight doesn't. <b>Everything above MZFW must be fuel</b> — extra body weight overstresses the wing roots.", "ref": "Ref 13"},
{"cat": "Weight Chain", "q": "Takeoff Weight is the actual total weight of the aircraft at the moment ________.", "o": ["the parking brake is released at the gate", "fueling is complete", "it starts rolling for takeoff"], "a": 2, "exp": "<b>TOW = weight when the takeoff roll begins</b> — after taxi fuel has burned off. At the gate you're at ramp weight.", "ref": "Ref 13"},
{"cat": "Weight Chain", "q": "MTOW is the highest certified weight allowed to begin the takeoff run, limited by ________.", "o": ["structural strength or runway performance", "fuel tank capacity only", "the payload contract"], "a": 0, "exp": "<b>MTOW = structural OR performance ceiling</b>, whichever bites — on a short/hot/high runway the performance-limited weight sits below structural.", "ref": "Ref 13"},
{"cat": "Weight Chain", "q": "Landing Weight equals takeoff weight minus ________.", "o": ["taxi fuel", "the fuel burned during the flight", "payload unloaded at destination"], "a": 1, "exp": "<b>LDW = TOW − trip fuel.</b> One of Frank's two three-variable formulas — nothing else leaves the airplane in flight.", "ref": "Ref 13"},
{"cat": "Weight Chain", "q": "The Maximum Landing Weight protects the ________ upon touchdown.", "o": ["engine mounts", "cabin floor", "landing gear and airframe"], "a": 2, "exp": "<b>MLW is certified around touchdown loads on the gear and airframe</b> — landing hits harder than taxiing.", "ref": "Ref 13"},
{"cat": "Weight Chain", "q": "The weight that includes everything on board EXCEPT usable fuel is the ________.", "o": ["zero fuel weight", "empty operating weight", "ramp weight"], "a": 0, "exp": "<b>ZFW</b> — EOW + payload, no usable fuel. EOW excludes payload too; ramp weight includes all the fuel.", "ref": "Ref 13"},
{"cat": "Weight Chain", "q": "Ramp (taxi) weight exceeds takeoff weight by ________.", "o": ["the reserve fuel", "the taxi fuel", "the alternate fuel"], "a": 1, "exp": "<b>Ramp = ZFW + all usable fuel; TOW = ramp − taxi fuel.</b> That's why max ramp weight sits slightly above MTOW.", "ref": "Ref 13"},
{"cat": "Weight Chain", "q": "The three variables that produce takeoff weight are:", "o": ["MTOW, MLW, and MZFW", "EOW, trip fuel, and reserves", "ZFW, usable fuel, and taxi fuel"], "a": 2, "exp": "<b>TOW = ZFW + usable fuel − taxi fuel.</b> Frank's formula #1. (Equivalent: EOW + payload + fuel − taxi.)", "ref": "Ref 13"},
{"cat": "Weight Chain", "q": "The three variables that produce landing weight are:", "o": ["ZFW, usable fuel loaded, and total fuel burned (taxi + trip)", "EOW, payload, and reserves", "MTOW, headwind, and flap setting"], "a": 0, "exp": "<b>LDW = ZFW + fuel loaded − all fuel burned</b> — same answer as TOW − trip fuel, or ZFW + fuel remaining. Frank's formula #2.", "ref": "Ref 13"},
{"cat": "Weight Chain", "q": "Zero fuel weight, ________, and ________ combine to give ramp weight... fill the blanks:", "o": ["taxi fuel / trip fuel", "usable fuel / nothing else — ramp weight is ZFW plus ALL usable fuel", "payload / crew weight"], "a": 1, "exp": "<b>Ramp = ZFW + total usable fuel.</b> Everything is aboard, nothing burned yet.", "ref": "Ref 13"},
{"cat": "Weight Chain", "q": "Working backwards from touchdown: takeoff weight equals landing weight plus ________.", "o": ["taxi fuel", "reserve fuel", "trip fuel"], "a": 2, "exp": "Reverse the chain: <b>TOW = LDW + trip fuel</b>. This is how you find what you must weigh at brake release to hit a target landing weight.", "ref": "Ref 13"},
{"cat": "Weight Chain", "q": "When landing weight is the binding restriction, the maximum allowable takeoff weight equals ________.", "o": ["MLW plus trip fuel", "MLW minus trip fuel", "MZFW plus taxi fuel"], "a": 0, "exp": "<b>Landing-limited TOW = MLW + trip burn</b> — you may take off heavier than MLW only by what you'll burn before touchdown.", "ref": "Ref 13"},
{"cat": "Weight Chain", "q": "Fuel remaining at touchdown equals landing weight minus ________.", "o": ["empty operating weight", "zero fuel weight", "payload"], "a": 1, "exp": "<b>LDW − ZFW = fuel still aboard.</b> ZFW never changes in flight; anything above it is fuel.", "ref": "Ref 13"},
{"cat": "Weight Chain", "q": "The maximum structural payload equals ________ minus ________.", "o": ["MZFW / EOW", "MTOW / MLW", "MLW / ZFW"], "a": 0, "exp": "<b>Max structural payload = MZFW − EOW.</b> When takeoff weight is restricted, the allowable payload may be even less: allowable TOW − fuel − EOW; take the LOWER.", "ref": "Ref 13"},
{"cat": "Weight Chain", "q": "Trip fuel equals ________ minus ________.", "o": ["ramp weight / ZFW", "TOW / LDW", "LDW / reserves"], "a": 1, "exp": "<b>Trip fuel = TOW − LDW</b> — the same subtraction run in either direction. Ramp − ZFW would give TOTAL fuel, not trip.", "ref": "Ref 13"},
{"cat": "Weight Chain", "q": "EOW 91,300 lb; payload 38,500 lb. What is the zero fuel weight?", "o": ["129,800 lb", "137,300 lb", "128,800 lb"], "a": 0, "exp": "91,300 + 38,500 = <b>129,800 lb</b>. ZFW = EOW + payload.", "ref": "Ref 13"},
{"cat": "Weight Chain", "q": "ZFW 129,800 lb; total usable fuel 46,000 lb; taxi fuel 800 lb. What is the takeoff weight?", "o": ["175,800 lb", "175,000 lb", "174,200 lb"], "a": 1, "exp": "129,800 + 46,000 = 175,800 ramp; − 800 taxi = <b>175,000 lb</b>. Option A is the ramp weight — the classic forgot-the-taxi-fuel trap.", "ref": "Ref 13"},
{"cat": "Weight Chain", "q": "TOW 175,000 lb; trip fuel 32,000 lb. What is the landing weight?", "o": ["143,800 lb", "141,000 lb", "143,000 lb"], "a": 2, "exp": "175,000 − 32,000 = <b>143,000 lb</b>. LDW = TOW − trip fuel.", "ref": "Ref 13"},
{"cat": "Weight Chain", "q": "MLW 146,300 lb; planned trip fuel 14,200 lb. What is the maximum takeoff weight the landing limit allows?", "o": ["160,500 lb", "146,300 lb", "132,100 lb"], "a": 0, "exp": "146,300 + 14,200 = <b>160,500 lb</b>. Backwards from the landing limit: MLW + burn. Option C subtracted instead of adding.", "ref": "Ref 13"},
{"cat": "Weight Chain", "q": "TOW 168,400 lb; landing weight 151,900 lb. How much fuel was burned en route?", "o": ["17,500 lb", "16,500 lb", "15,500 lb"], "a": 1, "exp": "168,400 − 151,900 = <b>16,500 lb</b>. Trip fuel = TOW − LDW.", "ref": "Ref 13"},
{"cat": "Weight Chain", "q": "Landing weight 143,000 lb; ZFW 129,800 lb. How much fuel is aboard at touchdown?", "o": ["12,200 lb", "14,200 lb", "13,200 lb"], "a": 2, "exp": "143,000 − 129,800 = <b>13,200 lb</b>. Everything above ZFW is fuel.", "ref": "Ref 13"},
{"cat": "Weight Chain", "q": "MZFW 138,300 lb; EOW 91,300 lb. What is the maximum structural payload?", "o": ["48,000 lb", "45,000 lb", "47,000 lb"], "a": 2, "exp": "138,300 − 91,300 = <b>47,000 lb</b>. Max structural payload = MZFW − EOW.", "ref": "Ref 13"},
{"cat": "Weight Chain", "q": "Allowable TOW 174,200 lb; fuel load 40,000 lb; EOW 91,300 lb; MZFW 138,300 lb. What is the maximum payload today?", "o": ["47,000 lb", "42,900 lb", "44,900 lb"], "a": 1, "exp": "TOW-limited payload: 174,200 − 40,000 − 91,300 = <b>42,900 lb</b>. The structural answer (47,000) is bigger, so today the TAKEOFF limit governs — always take the lower.", "ref": "Ref 13"},
{"cat": "Weight Chain", "q": "ZFW 120,000 lb; total usable fuel 35,000 lb; taxi fuel 700 lb; trip fuel 21,000 lb. What is the landing weight?", "o": ["134,000 lb", "154,300 lb", "133,300 lb"], "a": 2, "exp": "TOW = 120,000 + 35,000 − 700 = 154,300; LDW = 154,300 − 21,000 = <b>133,300 lb</b>. Option B stopped at takeoff weight; option A forgot taxi fuel.", "ref": "Ref 13"},
{"cat": "Weight Chain", "q": "Overloading an aircraft ________ the stall speed and therefore ________ approach speeds.", "o": ["raises / requires higher", "lowers / allows lower", "does not change / does not change"], "a": 0, "exp": "More weight = more lift needed = <b>higher stall speed</b> → higher approach speed → less margin and more runway to stop.", "ref": "Ref 13"},
{"cat": "Weight Chain", "q": "Two performance effects of overloading are:", "o": ["Shorter takeoff roll and steeper climb", "Longer takeoff/landing distances and reduced climb performance", "Lower fuel burn and better range"], "a": 1, "exp": "Overweight = <b>longer distances both ends + weaker climb</b> (obstacle clearance!), plus higher burn, shorter range, sluggish handling, structural stress.", "ref": "Ref 13"},
{"cat": "Weight Chain", "q": "Beyond performance, flying overweight also ________.", "o": ["is acceptable if within CG limits", "only matters on wet runways", "violates regulations and stresses the airframe and landing gear"], "a": 2, "exp": "Weight limits are certification limits: exceeding them is a <b>regulatory violation</b> and risks structural damage — even with the CG in range.", "ref": "Ref 13"},

// ---- Weather Hazards FOM deep dive (ref 12, added 2026-07-25) ----
{"cat": "Hazards", "q": "Clear air turbulence (CAT) occurs:", "o": ["In the free atmosphere away from visible convective activity", "Only inside the tops of building cumulus", "Within 10 miles of any thunderstorm"], "a": 0, "exp": "CAT = turbulence in the <b>free atmosphere away from visible convective activity</b> — includes high-level frontal and jet stream turbulence and strong vertical windshears.", "ref": "FOM 24.5.1"},
{"cat": "Hazards", "q": "Mountain wave turbulence may include:", "o": ["Only smooth laminar lift on the windward side", "High-amplitude waves, rotors, and highly sheared layers near the tropopause and the surface", "Turbulence confined to below ridge level"], "a": 1, "exp": "Mountain lee waves bring <b>high-amplitude waves, rotors, and turbulence in sheared layers near the tropopause AND near the surface</b>.", "ref": "FOM 24.5.1"},
{"cat": "Hazards", "q": "Which is listed as a cause of LOW-level turbulence?", "o": ["Abrupt temperature change through an upper-level front", "Waves downwind of high terrain", "Strong surface heating"], "a": 2, "exp": "Low-level causes: uneven-surface wind flow, <b>strong surface heating</b>, thunderstorm outflows, abrupt frontal/inversion wind shifts, wake turbulence. The other two options are HIGH-altitude causes.", "ref": "FOM 24.5.1"},
{"cat": "Hazards", "q": "A high-altitude turbulence cause tied to the top of the troposphere is:", "o": ["The abrupt wind and/or temperature change near the tropopause", "Thermals from surface heating reaching cruise level", "Wake vortices sinking from above"], "a": 0, "exp": "The <b>abrupt wind/temperature change near the tropopause</b> — the same region where jet-stream cores ride (ties to ref 09 tropopause material).", "ref": "FOM 24.5.1"},
{"cat": "Hazards", "q": "Wake turbulence is:", "o": ["Jet engine exhaust blast behind a departing aircraft", "The vortex formed at the wingtip in flight as a by-product of lift", "Propwash confined to within one wingspan of the aircraft"], "a": 1, "exp": "Wake = <b>wingtip vortex, a by-product of lift</b> — not engine blast. If the wing is making lift, it is making wake.", "ref": "FOM 24.5.1"},
{"cat": "Hazards", "q": "Wake vortices are generated:", "o": ["From engine start until shutdown", "Only above 500 ft AGL", "From rotation for takeoff until touchdown"], "a": 2, "exp": "Vortices exist <b>from rotation until touchdown</b> — whenever the wing is producing lift in flight.", "ref": "FOM 24.5.1"},
{"cat": "Hazards", "q": "Wake turbulence intensity is greatest from an aircraft that is:", "o": ["Heavy, flying slow, in a clean configuration", "Heavy, flying fast, with flaps extended", "Light, flying slow, with gear down"], "a": 0, "exp": "<b>Heavy + slow + clean</b> = strongest vortices. Also greater from newer high-lift wing designs (e.g., B777).", "ref": "FOM 24.5.1"},
{"cat": "Hazards", "q": "Compared to older designs, recently designed aircraft with higher-lift wings (e.g., B777) produce:", "o": ["Weaker wake vortices", "Greater wake vortices", "Identical wake vortices"], "a": 1, "exp": "The FOM singles out <b>recently designed higher-lift wings as producing GREATER wake</b> — the B777 is its example.", "ref": "FOM 24.5.1"},
{"cat": "Hazards", "q": "In flight, wake vortices sink at approximately ________ and level off about ________ below the generating aircraft.", "o": ["1,000 fpm / 2,000 ft", "100 fpm / 300 ft", "400–500 fpm / 900 ft"], "a": 2, "exp": "<b>400–500 fpm sink, leveling ~900 ft below</b> — why following traffic 1,000 ft below on the same track is the bad place to be.", "ref": "FOM 24.5.1"},
{"cat": "Hazards", "q": "A wake vortex generated near the ground tends to:", "o": ["Dissipate instantly on contact with the surface", "Rise back toward the flight path", "Move laterally over the ground at about 5 knots"], "a": 2, "exp": "Near-ground vortices <b>translate laterally at ~5 kt</b> — a light crosswind can hold one over the runway or push it onto a parallel.", "ref": "FOM 24.5.1"},
{"cat": "Hazards", "q": "An aircraft flying into another aircraft's wake will tend to experience:", "o": ["An induced roll", "A pure pitch-down", "A sudden static discharge"], "a": 0, "exp": "The vortex <b>induces roll</b> — the hazard is greatest when the encountering aircraft's wingspan fits inside the vortex.", "ref": "FOM 24.5.1"},
{"cat": "Hazards", "q": "A gust front can precede a thunderstorm by:", "o": ["1 to 2 miles", "10 to 15 miles", "50 to 60 miles"], "a": 1, "exp": "<b>10–15 miles ahead</b> of the storm — the airport can be hit by shear while the storm is still off the field.", "ref": "FOM 24.5.2"},
{"cat": "Hazards", "q": "Gust front passage is identified by:", "o": ["Steadily rising temperature and calm winds", "A slow 10° wind shift with light gusts", "Rapidly shifting winds up to 180° and gusts to 75 knots or more"], "a": 2, "exp": "Rapid shifts (<b>up to 180°</b>), gusts <b>to 75 kt or more</b>, dust in arid regions, considerable low-level turbulence.", "ref": "FOM 24.5.2"},
{"cat": "Hazards", "q": "As a thunderstorm approaches and passes overhead, the barometric pressure:", "o": ["Falls abruptly, then rises rapidly as the storm moves overhead and rain begins, then gradually returns to normal", "Rises steadily throughout the event", "Falls continuously until the storm dissipates"], "a": 0, "exp": "<b>Abrupt fall → rapid rise (storm overhead, rain begins) → gradual return</b>. That swing is why altimeter settings go stale fast in convective weather.", "ref": "FOM 24.5.2"},
{"cat": "Hazards", "q": "The pressure fluctuations around a thunderstorm stress the need for:", "o": ["Switching to GPS altitude", "Updated altimeter settings whenever convective weather is in the airport area", "Flying 500 ft above normal approach altitudes"], "a": 1, "exp": "The FOM's stated operational lesson: <b>keep the altimeter setting current in convective weather</b>.", "ref": "FOM 24.5.2"},
{"cat": "Hazards", "q": "Lightning strikes and static discharges most frequently occur when the thunderstorm grows to heights where the outside air temperature is:", "o": ["Near −40°C", "Near +15°C", "Near 0°C"], "a": 2, "exp": "Strikes/discharges cluster where <b>OAT is near 0°C</b> — the mixed rain/ice charge-separation zone.", "ref": "FOM 24.5.2"},
{"cat": "Hazards", "q": "Extremely heavy rain is a hazard to jet aircraft because it can:", "o": ["Only reduce visibility", "Cause engine flameout and degrade airfoil aerodynamic properties", "Freeze instantly on the windshield"], "a": 1, "exp": "The FOM lists <b>flameout</b> plus <b>degraded airfoil aerodynamics</b> — and on the runway, standing water that beats the drainage inhibits braking and directional control, worse with crosswind.", "ref": "FOM 24.5.2"},
{"cat": "Hazards", "q": "Thunderstorm elements such as turbulence, windshear, and hail:", "o": ["Stay confined inside the cloud", "Can extend to ground level even in VMC below the base", "Occur only above the freezing level"], "a": 1, "exp": "The elements <b>often extend to ground level even in visual conditions below the base</b> — clear air under a cell is not safe air.", "ref": "FOM 24.5.2"},
{"cat": "Hazards", "q": "The probability that a cell contains hail increases with:", "o": ["The storm's forward speed", "Distance from a front", "The height of the cell"], "a": 2, "exp": "Hail correlates with echo intensity, and <b>the greater the cell height, the greater the hail probability</b> — strong updrafts build both.", "ref": "FOM 24.5.2"},
{"cat": "Hazards", "q": "Radar echo shapes that suggest hail and severe turbulence include:", "o": ["Protrusions, fingers, hooks, or wavy scalloped edges", "Perfectly circular echoes", "Thin straight lines"], "a": 0, "exp": "<b>Fingers, hooks, protrusions, scalloped edges</b> = hail/severe turbulence signatures. A hook can also mark tornadic rotation.", "ref": "FOM 24.5.2"},
{"cat": "Hazards", "q": "Hail carried aloft by strong updrafts can fall:", "o": ["Only straight down through the storm core", "Some distance from the core, particularly beneath the anvil", "Never more than 1/4 mile from the rain shaft"], "a": 1, "exp": "Updrafts throw hail downwind — it can land <b>well away from the core, especially under the anvil</b>. Don't route under the overhang.", "ref": "FOM 24.5.2"},
{"cat": "Hazards", "q": "On radar, a hail shaft:", "o": ["Shows a distinctive purple return", "Always appears as a hole in the echo", "Generally cannot be distinguished from a rain shaft"], "a": 2, "exp": "High reflectivity, yes — but <b>indistinguishable from rain</b>. And rain at the surface does not mean there's no hail aloft.", "ref": "FOM 24.5.2"},
{"cat": "Hazards", "q": "In tropical and subtropical regions, hail:", "o": ["Frequently does not reach the ground", "Is larger than in mid-latitudes at the surface", "Cannot form at all"], "a": 0, "exp": "Warm lower layers melt it — <b>hail frequently never reaches the ground</b> in the tropics/subtropics. It's still up there for the airframe, though.", "ref": "FOM 24.5.2"},
{"cat": "Hazards", "q": "An NWS VIP Level 2 return corresponds to onboard radar color ________ and intensity ________.", "o": ["green / weak", "yellow / moderate", "red / strong"], "a": 1, "exp": "Table 24.14: 1 green-weak, <b>2 yellow-moderate</b>, 3 red-strong, 4 red-very strong, 5 red/magenta-intense, 6 red/magenta-extreme.", "ref": "FOM Table 24.14"},
{"cat": "Hazards", "q": "VIP Level 3 convective precipitation is classified as:", "o": ["Moderate", "Very strong", "Strong"], "a": 2, "exp": "<b>VIP 3 = red = STRONG</b>. VIP 4 is also red but VERY strong — the color alone doesn't separate 3 from 4.", "ref": "FOM Table 24.14"},
{"cat": "Hazards", "q": "The onboard radar color for VIP Levels 5 and 6 is:", "o": ["Red/magenta", "Solid red", "Yellow with red core"], "a": 0, "exp": "<b>5 and 6 = red/magenta</b> — intense and extreme. These are SIGMET-grade returns.", "ref": "FOM Table 24.14"},
{"cat": "Hazards", "q": "VIP levels used in SIGMETs and by ATC describe:", "o": ["Cloud top heights", "Convective precipitation intensity", "Lightning strike frequency"], "a": 1, "exp": "The NWS Video Integrator and Processor levels grade <b>convective precipitation intensity</b>, 1 (weak) through 6 (extreme).", "ref": "FOM Table 24.14"},
{"cat": "Hazards", "q": "A microburst is created when:", "o": ["Air aloft is cooled by evaporation of falling precipitation, becomes denser, and descends", "Surface air is superheated and rises rapidly", "A gust front collides with a sea breeze"], "a": 0, "exp": "<b>Evaporative cooling → denser air → accelerating downdraft → spreads out in all directions at the ground</b>. Wet = heavy rain; dry = virga.", "ref": "FOM 24.5.3"},
{"cat": "Hazards", "q": "A dry microburst is associated with:", "o": ["Heavy rain reaching the surface", "Snow squalls", "Precipitation that evaporates before reaching the ground (virga)"], "a": 2, "exp": "<b>Dry microburst = all precip evaporates aloft — virga</b>. The evaporation is exactly what fuels the cold downdraft. No rain at the surface ≠ no microburst.", "ref": "FOM 24.5.3"},
{"cat": "Hazards", "q": "Microburst downdrafts are typically ________ in diameter and can be as strong as ________.", "o": ["less than 1 mile / 6,000 fpm", "5 miles / 2,000 fpm", "10 miles / 500 fpm"], "a": 0, "exp": "<b><1 mile across, up to 6,000 fpm down</b>. Small and violent — which is why conventional sensors miss them.", "ref": "FOM 24.5.3"},
{"cat": "Hazards", "q": "The microburst downdraft begins changing to horizontal flow at approximately:", "o": ["100 ft above the ground", "1,000 to 3,000 ft above the ground", "10,000 ft above the ground"], "a": 1, "exp": "<b>1,000–3,000 ft AGL</b> the column turns horizontal, reaching up to <b>45 kt outflow in each direction</b> at the surface.", "ref": "FOM 24.5.3"},
{"cat": "Hazards", "q": "An aircraft crossing the center of a microburst could encounter a total windshear of up to:", "o": ["25 knots", "45 knots", "90 knots"], "a": 2, "exp": "45 kt headwind flipping to 45 kt tailwind = <b>up to 90 kt of shear</b> across a footprint of only 1–2 miles.", "ref": "FOM 24.5.3"},
{"cat": "Hazards", "q": "Entering a microburst on approach, the sequence an unaware pilot experiences is:", "o": ["Increasing headwind and power reduction, then increasing tailwind with rapidly decaying airspeed near the ground at low power", "Immediate tailwind, then a compensating headwind", "A pure downdraft with no airspeed change"], "a": 0, "exp": "First half: <b>headwind → aircraft floats high/fast → power comes OFF</b>. Second half: <b>tailwind → performance collapses at low power, low altitude</b>. That sequencing is the killer.", "ref": "FOM 24.5.3"},
{"cat": "Hazards", "q": "Microbursts seldom last more than ________, and when activity starts, ________.", "o": ["15 minutes / multiple microbursts in the area should be expected", "1 hour / no further activity is likely", "5 minutes / they never repeat in the same area"], "a": 0, "exp": "<b>Seldom >15 min — but expect MULTIPLES</b> in the same general area once they start.", "ref": "FOM 24.5.3"},
{"cat": "Hazards", "q": "Atmospheric conditions conducive to microburst development include:", "o": ["Deep moist layer with calm winds and small temperature/dew point spread", "Localized heavy rain shaft, light surface winds outside the rain area, and a temperature/dew point spread near 15°C", "Strong steady surface winds with low overcast"], "a": 1, "exp": "The FOM's cue list: <b>heavy localized rain shaft, light winds outside it, and a big (~15°C) temp/dew spread</b> — classic hot, dry-below-cloud afternoons (PHX!).", "ref": "FOM 24.5.3"},
{"cat": "Hazards", "q": "Microburst detection is best at airports equipped with:", "o": ["Standard ASR surveillance radar", "LLWAS-2", "TDWR"], "a": 2, "exp": "Small size + short duration beat conventional gear; <b>TDWR (Terminal Doppler Weather Radar)</b> is the FOM's named best detector. Otherwise: PIREPs and visual cues (dust, virga, rain patterns).", "ref": "FOM 24.5.3"},
{"cat": "Hazards", "q": "LLWAS-2 consists of ________ and provides ________.", "o": ["normally 6 anemometers (1 centerfield, 5 outlying) / Wind Shear Alert capability only", "up to 32 anemometers / Microburst Alerts", "a C-band radar / precipitation returns"], "a": 0, "exp": "<b>LLWAS-2: ~6 anemometers, Wind Shear Alert ONLY</b> — no microburst alert. Centerfield wind is always given; pilots may request any boundary wind even with no alert active.", "ref": "FOM 24.5.3"},
{"cat": "Hazards", "q": "LLWAS-NE (Network Expansion) uses up to 32 anemometers and can detect microbursts, gust fronts, wind shifts, and precipitation within:", "o": ["5 miles either side of the field in all directions", "1/2 mile either side of the runway centerline, extending 3 miles on final to 2 miles on departure", "The airport surface only"], "a": 1, "exp": "Coverage: <b>±1/2 mile of centerline, 3 mi final / 2 mi departure</b> — and it IS Microburst-Alert capable, unlike LLWAS-2.", "ref": "FOM 24.5.3"},
{"cat": "Hazards", "q": "TDWR is a ________ located ________ the airport.", "o": ["X-band radar / on the tower at", "S-band radar / 25 miles from", "C-band radar / 8 to 10 miles from"], "a": 2, "exp": "<b>TDWR: C-band, sited 8–10 miles off the field</b>, watching the same ±1/2-mile, 3-final/2-departure corridors, with both Wind Shear and Microburst Alerts.", "ref": "FOM 24.5.3"},
{"cat": "Hazards", "q": "When analyzing fuel requirements, the FOM says to consider forecast winds aloft, destination weather, alternate airports, and:", "o": ["The possible need to file more than one alternate airport", "Only the cheapest tankering option", "The maximum structural landing weight first"], "a": 0, "exp": "24.6.1's list ends with <b>possibly filing MORE than one alternate</b> and identifying airports suitable for diversion en route.", "ref": "FOM 24.6.1"},
{"cat": "Hazards", "q": "When two alternates are filed for Anchorage, the preferred alternate is ________ and fuel should permit proceeding to ________.", "o": ["the farther one / the nearest one", "the nearest one / the farther of the two", "either / the nearest only"], "a": 1, "exp": "<b>Nearest = preferred; farther = backup — but carry fuel to the FARTHER one</b>, preserving options if ANC goes below minimums. Alaska winter also brings special MEL considerations.", "ref": "FOM 24.6.1"},
{"cat": "Hazards", "q": "Weather restrictions considered for Alaska operations go beyond ceiling and visibility to include:", "o": ["Only runway snow depth", "Volcanic activity exclusively", "Severe turbulence, gusty winds/windshear, excessive crosswinds, reduced braking action, runway snow-removal closures, icing, and fog"], "a": 2, "exp": "The ANC list: <b>turbulence, gusts/shear, crosswinds, slippery runways/braking, snow-removal closures, icing, fog</b> — dispatch legality is more than a TAF check.", "ref": "FOM 24.6.1"},

// ---- METAR/TAF FOM deep dive (ref 11, added 2026-07-25) ----
{"cat": "METAR/TAF", "q": "<pre class='paper'>METAR KDCA 231152Z 09008KT 040V130 2SM BR OVC004 17/16 A3001\nRMK AO2 SLP164 T01720161 10183 20161</pre>In this report, <code>040V130</code> indicates:", "o": ["Wind direction varying between 040° and 130°", "Runway visual range between 4,000 and 13,000 ft", "Gusts between 4 and 13 knots"], "a": 0, "exp": "When METAR wind direction varies by <b>60° or more</b>, a variability group is appended — here the wind swings 040°–130°.", "ref": "FOM Table 24.1"},
{"cat": "METAR/TAF", "q": "<pre class='paper'>METAR KDCA 231152Z 09008KT 040V130 2SM BR OVC004 17/16 A3001\nRMK AO2 SLP164 T01720161 10183 20161</pre><code>T01720161</code> indicates:", "o": ["Max temp 17.2°C, min temp 16.1°C over 6 hours", "Temperature +17.2°C and dew point +16.1°C", "Temperature −17.2°C, dew point −16.1°C"], "a": 1, "exp": "T-group: temp/dew point in <b>tenths of °C</b>; leading digit 0 = positive, 1 = negative. 0172 → +17.2°C, 0161 → +16.1°C — matches the body 17/16.", "ref": "FOM Table 24.8"},
{"cat": "METAR/TAF", "q": "<pre class='paper'>METAR KDCA 231152Z 09008KT 040V130 2SM BR OVC004 17/16 A3001\nRMK AO2 SLP164 T01720161 10183 20161</pre><code>10183</code> indicates:", "o": ["Rainfall of 1.83 inches in the last hour", "Station pressure 1018.3 mb", "Maximum temperature of 18.3°C during the last 6 hours"], "a": 2, "exp": "Leading <b>1</b> = 6-hour <b>maximum</b> temperature in tenths (00/06/12/18Z obs). The <code>20161</code> beside it = 6-hour minimum 16.1°C.", "ref": "FOM Table 24.9"},
{"cat": "METAR/TAF", "q": "<pre class='paper'>METAR KDCA 231152Z 09008KT 040V130 2SM BR OVC004 17/16 A3001\nRMK AO2 SLP164 T01720161 10183 20161</pre>The ceiling in this report is:", "o": ["400 ft", "4,000 ft", "There is no ceiling — the layer is scattered"], "a": 0, "exp": "Ceiling = lowest <b>BKN or OVC</b> layer, in hundreds of feet AGL. OVC004 = <b>400 ft</b> — alternate-minimums territory for the dispatcher.", "ref": "FOM Table 24.1"},
{"cat": "METAR/TAF", "q": "<pre class='paper'>METAR KDCA 231152Z 09008KT 040V130 2SM BR OVC004 17/16 A3001\nRMK AO2 SLP164 T01720161 10183 20161</pre><code>SLP164</code> indicates:", "o": ["Sea level pressure 1164 mb", "Sea level pressure 1016.4 mb", "Pressure gradient of 16.4 mb per 100 NM"], "a": 1, "exp": "SLP = sea level pressure, last three digits in <b>tenths of millibars</b>: SLP164 → 1016.4 mb (FOM example: SLP013 = 1001.3 mb).", "ref": "FOM Table 24.8"},
{"cat": "METAR/TAF", "q": "<pre class='paper'>METAR KMIA 052253Z COR VRB03G18KT 1 1/2SM R09/P6000FT +TSRA BKN008CB OVC015 24/23 A2984\nRMK RAB13 TSB18 PRESFR FRQ LTGCGIC OHD CB OHD MOV NE SLP102</pre><code>COR</code> in the date-time group means:", "o": ["A coordinated observation from two sensors", "A correction applying to the RVR only", "A corrected observation"], "a": 2, "exp": "<b>COR = corrected</b> observation. AUTO would mean fully automated with no human intervention.", "ref": "FOM Table 24.1"},
{"cat": "METAR/TAF", "q": "<pre class='paper'>METAR KMIA 052253Z COR VRB03G18KT 1 1/2SM R09/P6000FT +TSRA BKN008CB OVC015 24/23 A2984\nRMK RAB13 TSB18 PRESFR FRQ LTGCGIC OHD CB OHD MOV NE SLP102</pre><code>VRB03G18KT</code> indicates:", "o": ["Wind of variable direction at 3 knots, gusting 18", "Wind 030° at 18 knots", "Wind variable between 030° and 180° at 18 knots"], "a": 0, "exp": "<b>VRB</b> = variable direction; next digits speed (3 kt); <b>G</b> + max gust (18 kt).", "ref": "FOM Table 24.1"},
{"cat": "METAR/TAF", "q": "<pre class='paper'>METAR KMIA 052253Z COR VRB03G18KT 1 1/2SM R09/P6000FT +TSRA BKN008CB OVC015 24/23 A2984\nRMK RAB13 TSB18 PRESFR FRQ LTGCGIC OHD CB OHD MOV NE SLP102</pre><code>R09/P6000FT</code> indicates:", "o": ["Runway 09 visual range less than 6,000 ft", "Runway 09 visual range variable to 6,000 ft", "Runway 09 visual range greater than 6,000 ft"], "a": 2, "exp": "RVR prefixes: <b>P = plus (greater than)</b>, M = minus (less than), V between values = variable.", "ref": "FOM Table 24.1"},
{"cat": "METAR/TAF", "q": "<pre class='paper'>METAR KMIA 052253Z COR VRB03G18KT 1 1/2SM R09/P6000FT +TSRA BKN008CB OVC015 24/23 A2984\nRMK RAB13 TSB18 PRESFR FRQ LTGCGIC OHD CB OHD MOV NE SLP102</pre><code>RAB13 TSB18</code> indicates:", "o": ["Rain and thunder ended at :13 and :18", "Rain began 13 minutes past the hour; thunderstorm began 18 minutes past the hour", "Rain for 13 minutes, thunderstorm for 18 minutes"], "a": 1, "exp": "<b>B = began, E = ended</b>, digits = minutes past the hour (pattern: TSB07RB33E50).", "ref": "FOM Table 24.8"},
{"cat": "METAR/TAF", "q": "<pre class='paper'>METAR KMIA 052253Z COR VRB03G18KT 1 1/2SM R09/P6000FT +TSRA BKN008CB OVC015 24/23 A2984\nRMK RAB13 TSB18 PRESFR FRQ LTGCGIC OHD CB OHD MOV NE SLP102</pre><code>PRESFR</code> indicates:", "o": ["The altimeter is falling at a rate of at least 0.06 inches per hour", "The altimeter is rising at a rate of at least 0.06 inches per hour", "A pressure sensor failure"], "a": 0, "exp": "<b>PRESsure Falling Rapidly</b> — ≥ 0.06 in/hr. PRESRR = rising rapidly. In a TS, expect altimeter chasing and gusty shifts.", "ref": "FOM Table 24.8"},
{"cat": "METAR/TAF", "q": "<pre class='paper'>METAR KMIA 052253Z COR VRB03G18KT 1 1/2SM R09/P6000FT +TSRA BKN008CB OVC015 24/23 A2984\nRMK RAB13 TSB18 PRESFR FRQ LTGCGIC OHD CB OHD MOV NE SLP102</pre><code>FRQ LTGCGIC OHD</code> indicates:", "o": ["Frequent lightning cloud-to-ground only, northeast", "Frequent lightning, cloud-to-ground and in-cloud, overhead", "Four lightning flashes overhead in the last hour"], "a": 1, "exp": "LTG + type letters: <b>CG</b> cloud-to-ground, <b>IC</b> in-cloud (also CC cloud-to-cloud, CA cloud-to-air); OHD = overhead.", "ref": "FOM Table 24.8"},
{"cat": "METAR/TAF", "q": "<pre class='paper'>METAR KMIA 052253Z COR VRB03G18KT 1 1/2SM R09/P6000FT +TSRA BKN008CB OVC015 24/23 A2984\nRMK RAB13 TSB18 PRESFR FRQ LTGCGIC OHD CB OHD MOV NE SLP102</pre>The precipitation intensity reported in the body of this METAR is:", "o": ["Light", "Moderate", "Heavy"], "a": 2, "exp": "<code>+TSRA</code> — the <b>+</b> is the intensity prefix on the precipitation: heavy thunderstorm rain (− light, no sign moderate).", "ref": "FOM Table 24.2"},
{"cat": "METAR/TAF", "q": "<pre class='paper'>TAF KBOS 111730Z 111818 04012KT 6SM -RA OVC020\nFM0200 36018G30KT 2SM SN BLSN OVC008 WS015/04045KT\nTEMPO 0408 3/4SM +SN VV003\nBECMG 1214 30010KT P6SM NSW SCT025</pre>The valid period <code>111818</code> covers:", "o": ["The 11th at 1800Z through the 12th at 1800Z", "The 11th from 0018Z to 1818Z", "18 hours beginning the 11th at 1100Z"], "a": 0, "exp": "TAF valid period = 2-digit date + begin hour + end hour: 11th 18Z → next day 18Z (FOM example 091818 = 09th 18Z through 10th 18Z).", "ref": "FOM Table 24.1"},
{"cat": "METAR/TAF", "q": "<pre class='paper'>TAF KBOS 111730Z 111818 04012KT 6SM -RA OVC020\nFM0200 36018G30KT 2SM SN BLSN OVC008 WS015/04045KT\nTEMPO 0408 3/4SM +SN VV003\nBECMG 1214 30010KT P6SM NSW SCT025</pre><code>WS015/04045KT</code> indicates:", "o": ["Wind shear on landing runway 15", "Wind shear from the surface to 1,500 ft AGL, wind 040° at 45 knots", "Wind shear at 4,500 ft, wind 015° at 40 knots"], "a": 1, "exp": "TAF windshear group: WS + height in hundreds of feet + wind. FOM example WS010/31022KT = surface–1,000 ft, 310°/22 kt.", "ref": "FOM Table 24.1"},
{"cat": "METAR/TAF", "q": "<pre class='paper'>TAF KBOS 111730Z 111818 04012KT 6SM -RA OVC020\nFM0200 36018G30KT 2SM SN BLSN OVC008 WS015/04045KT\nTEMPO 0408 3/4SM +SN VV003\nBECMG 1214 30010KT P6SM NSW SCT025</pre>The <code>TEMPO 0408</code> conditions are expected:", "o": ["Continuously from 0400Z to 0800Z", "Permanently beginning at 0400Z", "In periods under an hour each between 0400Z and 0800Z, totaling less than half that period"], "a": 2, "exp": "<b>TEMPO</b> = temporary fluctuations — each less than 1 hour, covering in total less than half the stated period. FM is the permanent change.", "ref": "FOM Table 24.1"},
{"cat": "METAR/TAF", "q": "<pre class='paper'>TAF KBOS 111730Z 111818 04012KT 6SM -RA OVC020\nFM0200 36018G30KT 2SM SN BLSN OVC008 WS015/04045KT\nTEMPO 0408 3/4SM +SN VV003\nBECMG 1214 30010KT P6SM NSW SCT025</pre><code>VV003</code> indicates:", "o": ["An obscured sky with vertical visibility 300 ft — which counts as a ceiling", "Variable visibility down to 3 SM", "3/8 cloud coverage at 300 ft — not a ceiling"], "a": 0, "exp": "<b>VV = vertical visibility</b> for an obscured sky, hundreds of feet — and it IS a ceiling. +SN with VV003: think alternate and landing minimums.", "ref": "FOM Table 24.1"},
{"cat": "METAR/TAF", "q": "<pre class='paper'>TAF KBOS 111730Z 111818 04012KT 6SM -RA OVC020\nFM0200 36018G30KT 2SM SN BLSN OVC008 WS015/04045KT\nTEMPO 0408 3/4SM +SN VV003\nBECMG 1214 30010KT P6SM NSW SCT025</pre><code>BECMG 1214</code> indicates:", "o": ["Conditions become permanent at exactly 1214Z", "A temporary fluctuation between 1200Z and 1400Z", "A gradual change expected beginning 1200Z through 1400Z"], "a": 2, "exp": "<b>BECMG</b> = gradual change during the 2-digit begin/end hour window (1300–1500Z in the FOM's BECMG 1315 example).", "ref": "FOM Table 24.1"},
{"cat": "METAR/TAF", "q": "<pre class='paper'>TAF KBOS 111730Z 111818 04012KT 6SM -RA OVC020\nFM0200 36018G30KT 2SM SN BLSN OVC008 WS015/04045KT\nTEMPO 0408 3/4SM +SN VV003\nBECMG 1214 30010KT P6SM NSW SCT025</pre><code>BLSN</code> indicates:", "o": ["Snow showers below the clouds", "Blowing snow", "Snow grains and mist"], "a": 1, "exp": "<b>BL</b> = blowing (descriptor, Table 24.3) + <b>SN</b> = snow (precipitation, Table 24.4).", "ref": "FOM Tables 24.3/24.4"},
{"cat": "METAR/TAF", "q": "<pre class='paper'>METAR KORD 091955Z COR 22015G25KT 3/4SM R28L/2600FT TSRA OVC010CB 18/16 A2992 RMK RERA</pre><code>RERA</code> indicates:", "o": ["Rain was recently observed", "Runway estimated rainfall amount follows", "Rain is expected to redevelop"], "a": 0, "exp": "<b>RE = recent weather</b>: RERA = recent rain — straight from the FOM's own METAR example.", "ref": "FOM Table 24.1"},
{"cat": "METAR/TAF", "q": "<pre class='paper'>METAR KORD 091955Z COR 22015G25KT 3/4SM R28L/2600FT TSRA OVC010CB 18/16 A2992 RMK RERA</pre><code>OVC010CB</code> indicates:", "o": ["Overcast at 10,000 ft, clouds building", "Overcast cumulonimbus clouds at 1,000 ft", "1/8–2/8 cumulonimbus at 1,000 ft"], "a": 1, "exp": "OVC = 8/8 coverage; 010 = 1,000 ft; <b>CB = cumulonimbus</b> type suffix. Thunderstorm cloud on the field at 1,000 ft.", "ref": "FOM Tables 24.1/24.7"},
{"cat": "METAR/TAF", "q": "<pre class='paper'>METAR CYYZ 041800Z 27010KT 15SM SCT030 BKN080 12/04 Q1018 RMK SC3AC5 SLP223</pre><code>Q1018</code> indicates:", "o": ["A sea-level-pressure remark of 101.8 mb", "The station elevation in feet", "Altimeter setting 1018 hectopascals, foreign-location format"], "a": 2, "exp": "<b>Q = whole hectopascals</b> (foreign); <b>A</b> = inches of mercury (US). Q1013 ≈ A2992 — standard day.", "ref": "FOM Table 24.1"},
{"cat": "METAR/TAF", "q": "<pre class='paper'>METAR CYYZ 041800Z 27010KT 15SM SCT030 BKN080 12/04 Q1018 RMK SC3AC5 SLP223</pre><code>SC3AC5</code> indicates:", "o": ["Canada-only remark: 3/8 stratocumulus and 5/8 altocumulus opaque sky cover", "A scattered layer at 300 ft and altocumulus at 500 ft", "Stratocumulus tops 3,000 ft, altocumulus tops 5,000 ft"], "a": 0, "exp": "<b>Canada only</b>: cloud type + opaque cover in eighths. Other codes: SF, CF, AS, CU, CI, TCU, CB. The CYYZ identifier is the tell.", "ref": "FOM Table 24.8"},
{"cat": "METAR/TAF", "q": "<pre class='paper'>METAR KPHX 210056Z AUTO 08006KT 10SM CLR 33/M02 A2995\nRMK AO2 SLP121 T03281022 PK WND 12038/32 WSHFT 0035 PRESRR 400440189</pre><code>AUTO</code> together with <code>CLR</code> indicates:", "o": ["An observer confirmed clear skies at all levels", "A fully automated report with no clouds detected below 12,000 ft", "An automated report manually corrected for sky condition"], "a": 1, "exp": "<b>AUTO</b> = no human intervention (omitted when an observer signs on); automated <b>CLR</b> = clear <b>below 12,000 ft</b> — the sensor can't see higher.", "ref": "FOM Table 24.1"},
{"cat": "METAR/TAF", "q": "<pre class='paper'>METAR KPHX 210056Z AUTO 08006KT 10SM CLR 33/M02 A2995\nRMK AO2 SLP121 T03281022 PK WND 12038/32 WSHFT 0035 PRESRR 400440189</pre><code>T03281022</code> indicates:", "o": ["Temperature +32.8°C, dew point +2.2°C", "Temperature +3.2°C, dew point +8.1°C", "Temperature +32.8°C, dew point −2.2°C"], "a": 2, "exp": "0328 → +32.8°C; <b>1</b>022 → leading 1 = negative → −2.2°C. Matches the body 33/M02. Desert split — huge temp/dew spread.", "ref": "FOM Table 24.8"},
{"cat": "METAR/TAF", "q": "<pre class='paper'>METAR KPHX 210056Z AUTO 08006KT 10SM CLR 33/M02 A2995\nRMK AO2 SLP121 T03281022 PK WND 12038/32 WSHFT 0035 PRESRR 400440189</pre><code>PK WND 12038/32</code> indicates:", "o": ["Peak wind in the last hour: 120° at 38 knots, 32 minutes past the hour", "Peak wind 120° at 32 knots lasting 38 minutes", "A peak gust of 120 knots at 0038Z"], "a": 0, "exp": "PK WND ddd ss/mm — direction, speed, minutes past the hour (FOM example: PK WND 20032/25).", "ref": "FOM Table 24.8"},
{"cat": "METAR/TAF", "q": "<pre class='paper'>METAR KPHX 210056Z AUTO 08006KT 10SM CLR 33/M02 A2995\nRMK AO2 SLP121 T03281022 PK WND 12038/32 WSHFT 0035 PRESRR 400440189</pre><code>400440189</code> indicates:", "o": ["Rainfall 4.40 inches in 24 hours and 1.89 in 6 hours", "24-hour maximum temperature 44.0°C and minimum 18.9°C", "Snow depth 44.0 inches with 1.89 water equivalent"], "a": 1, "exp": "Leading <b>4</b> + 8 digits = 24-hr max/min temps, tenths of °C, on the 0000 <b>local</b> observation: 0440 → 44.0°C, 0189 → 18.9°C.", "ref": "FOM Table 24.9"},
{"cat": "METAR/TAF", "q": "<pre class='paper'>METAR KDFW 121753Z 17011KT 4SM -FZDZ BR OVC006 M01/M03 A2977\nRMK SNINCR 1/3/8 4/010 P0015 60125 70180 FROPA 1720</pre><code>-FZDZ BR</code> indicates:", "o": ["Light freezing rain with fog", "Blowing drizzle in reduced visibility", "Light freezing drizzle and mist"], "a": 2, "exp": "<b>FZ</b> = freezing descriptor + <b>DZ</b> = drizzle; <b>BR</b> = mist (vis > 5/8 SM). Freezing RAIN would be FZRA — different beast for holdover tables.", "ref": "FOM Tables 24.3/24.4/24.5"},
{"cat": "METAR/TAF", "q": "<pre class='paper'>METAR KDFW 121753Z 17011KT 4SM -FZDZ BR OVC006 M01/M03 A2977\nRMK SNINCR 1/3/8 4/010 P0015 60125 70180 FROPA 1720</pre><code>SNINCR 1/3/8</code> indicates:", "o": ["Snowfall increasing — 1 inch in the last hour, 3 in the last 6 hours, 8 on the ground", "Snow began 1 hour ago, ending within 3–8 hours", "Snow cover increasing from 1/8 to 3/8"], "a": 0, "exp": "<b>SNINCR</b> = snowfall increasing: last hour / last 6 hours / total on the ground (FOM example 2/8/12).", "ref": "FOM Table 24.8"},
{"cat": "METAR/TAF", "q": "<pre class='paper'>METAR KDFW 121753Z 17011KT 4SM -FZDZ BR OVC006 M01/M03 A2977\nRMK SNINCR 1/3/8 4/010 P0015 60125 70180 FROPA 1720</pre><code>4/010</code> indicates:", "o": ["Visibility 1/4 SM in snow at 0100Z", "Snow depth on the ground of 1.0 inch", "Rainfall of 0.10 inches in 4 hours"], "a": 1, "exp": "Leading <b>4/</b> = snow depth in inches, reported on the <b>0000Z and 1200Z</b> observations (FOM example 4/021 = 2.1 in).", "ref": "FOM Table 24.9"},
{"cat": "METAR/TAF", "q": "<pre class='paper'>METAR KDFW 121753Z 17011KT 4SM -FZDZ BR OVC006 M01/M03 A2977\nRMK SNINCR 1/3/8 4/010 P0015 60125 70180 FROPA 1720</pre><code>70180</code> indicates:", "o": ["Peak wind 070° at 18 knots", "Maximum temperature 18.0°C in the last 7 hours", "1.80 inches of precipitation in the last 24 hours"], "a": 2, "exp": "Leading <b>7</b> = precipitation in the last <b>24 hours</b>. Its neighbor <code>60125</code> = 1.25 in over the last 6 hours (leading 6).", "ref": "FOM Table 24.9"},
{"cat": "METAR/TAF", "q": "A TAF is established for the ________ radius around an airport.", "o": ["10 nautical mile", "5 statute mile", "25 statute mile"], "a": 1, "exp": "FOM 24.1.2 — a TAF covers the <b>5 SM radius</b> around the airport.", "ref": "FOM 24.1.2"},
{"cat": "METAR/TAF", "q": "Each TAF is valid for a ________-hour period and is updated ________ times a day.", "o": ["24 / four", "30 / four", "12 / six"], "a": 0, "exp": "FOM 24.1.2 — <b>24 hours, four updates daily</b>. (Per the FOM — use this over generic 30-hour teaching.)", "ref": "FOM 24.1.2"},
{"cat": "METAR/TAF", "q": "TAFs are issued at:", "o": ["0300Z, 0900Z, 1500Z, 2100Z", "Sunrise and sunset local", "0000Z, 0600Z, 1200Z, 1800Z"], "a": 2, "exp": "FOM 24.1.2 — <b>0000Z, 0600Z, 1200Z, 1800Z</b>.", "ref": "FOM 24.1.2"},
{"cat": "METAR/TAF", "q": "A METAR is issued ________; a SPECI is issued ________.", "o": ["every 3 hours / every hour", "every hour / when a significant change occurs", "four times daily / on request"], "a": 1, "exp": "FOM 24.1.3 — METAR hourly; <b>SPECI = special observation triggered by significant change</b>.", "ref": "FOM 24.1.3"},
{"cat": "METAR/TAF", "q": "The message type <code>TESTM</code> identifies:", "o": ["A report from a non-commissioned ASOS", "A test transmission to disregard entirely", "A manually corrected TAF"], "a": 0, "exp": "Table 24.1 message types — TESTM = <b>non-commissioned ASOS report</b>.", "ref": "FOM Table 24.1"},
{"cat": "METAR/TAF", "q": "The modifier <code>AUTO</code> is omitted from a report when:", "o": ["The report goes out via ACARS", "Visibility exceeds 6 SM", "An observer signs on"], "a": 2, "exp": "Table 24.1 — AUTO = fully automated, no human intervention; <b>omitted when an observer signs on</b>.", "ref": "FOM Table 24.1"},
{"cat": "METAR/TAF", "q": "Wind direction in the body of a METAR is reported relative to ________ to the nearest ________.", "o": ["true north / 10 degrees", "magnetic north / 10 degrees", "true north / 5 degrees"], "a": 0, "exp": "Table 24.1 — <b>3-digit TRUE direction, nearest 10°</b>. Interview trap: tower/ATIS winds are magnetic; written reports are true.", "ref": "FOM Table 24.1"},
{"cat": "METAR/TAF", "q": "A variability group such as <code>180V260</code> is appended to the METAR wind when direction varies by:", "o": ["30° or more", "60° or more", "90° or more"], "a": 1, "exp": "Table 24.1 — appended at <b>60° or more</b> of variation.", "ref": "FOM Table 24.1"},
{"cat": "METAR/TAF", "q": "In a TAF, forecast visibility greater than 6 statute miles is written:", "o": ["9999", "6SM+", "P6SM"], "a": 2, "exp": "Table 24.1 — <b>P6SM</b> (Plus 6 SM). 9999 is the international meters format, not US TAF.", "ref": "FOM Table 24.1"},
{"cat": "METAR/TAF", "q": "In the United States, <code>VC</code> (vicinity) means weather occurring:", "o": ["5 to 10 statute miles from the center of the runway complex", "Within 8,000 m of the tower", "Anywhere inside the TAF area"], "a": 0, "exp": "Table 24.2 — US: <b>5–10 SM from the runway-complex center</b>; elsewhere, within 8,000 m.", "ref": "FOM Table 24.2"},
{"cat": "METAR/TAF", "q": "The visibility value separating FG from BR is:", "o": ["1 SM", "5/8 SM", "3/4 SM"], "a": 1, "exp": "Table 24.5 — <b>FG = vis below 5/8 SM; BR (mist) = 5/8 SM or more</b>.", "ref": "FOM Table 24.5"},
{"cat": "METAR/TAF", "q": "Large hail is defined as hailstones:", "o": ["1 inch in diameter or more", "Any hail reported with a thunderstorm", "1/4 inch in diameter or more"], "a": 2, "exp": "Table 24.4 note — <b>large ≥ 1/4 inch</b>; size reported in remarks in 1/4-inch increments.", "ref": "FOM Table 24.4"},
{"cat": "METAR/TAF", "q": "When hail is reported with no size given, the size is assumed to be:", "o": ["Small", "Large", "Unknown until a PIREP confirms"], "a": 0, "exp": "Table 24.4 note — <b>no size reported → assume small hail</b> (GR LESS THAN 1/4).", "ref": "FOM Table 24.4"},
{"cat": "METAR/TAF", "q": "Regarding operations in hail:", "o": ["Prohibited in any reported hail", "Not permitted in large hail; permitted in small hail with deicing/anti-icing procedures", "Permitted in any hail with radar operative"], "a": 1, "exp": "Table 24.4 note — <b>no ops in large hail; small hail OK with deice/anti-ice procedures</b>. Dispatch angle: check remarks for HLSTO size.", "ref": "FOM Table 24.4"},
{"cat": "METAR/TAF", "q": "The code <code>UP</code> appears only in:", "o": ["TAFs at tropical stations", "Reports where the observer cannot see the runway", "Automated observations"], "a": 2, "exp": "Table 24.4 — UP = <b>unknown precipitation in automated observations</b> — the sensor can't identify the type.", "ref": "FOM Table 24.4"},
{"cat": "METAR/TAF", "q": "The code <code>+FC</code> indicates:", "o": ["A tornado or waterspout", "Heavy funnel-shaped virga", "A rapidly building cumulus"], "a": 0, "exp": "Table 24.6 — FC = funnel cloud; <b>+FC = tornado or waterspout</b>.", "ref": "FOM Table 24.6"},
{"cat": "METAR/TAF", "q": "In a US surface observation, the RMK section appears immediately after the:", "o": ["Visibility group", "Altimeter setting", "Temperature and dew point"], "a": 1, "exp": "FOM 24.1.5 — remarks follow RMK, which comes right after the <b>altimeter setting</b>.", "ref": "FOM 24.1.5"},
{"cat": "METAR/TAF", "q": "<code>A01</code> or <code>A02</code> in the remarks identifies:", "o": ["First and second corrected transmissions", "The airport's alternate-minimums category", "An automated station"], "a": 2, "exp": "Table 24.8 — A01/A02 = <b>automated station</b>.", "ref": "FOM Table 24.8"},
{"cat": "METAR/TAF", "q": "ATC precipitation reports classify heavy precipitation as a rainfall rate of:", "o": ["0.5 to 2.0 inches per hour", "0.175 to 0.5 inches per hour", "2.0 or more inches per hour"], "a": 0, "exp": "Table 24.10 — Light 0.01–0.10 / Moderate 0.175–0.5 / <b>Heavy 0.5–2.0</b> / Extreme 2.0+. Displayed data can be up to <b>6 minutes old</b>.", "ref": "FOM Table 24.10"},
{"cat": "METAR/TAF", "q": "The remark <code>SFC VSBY 1/2</code> means the visibility in the body of the report is ________ and 1/2 SM is the ________.", "o": ["RVR / observer's estimate", "tower visibility / weather observer's prevailing visibility", "observer visibility / tower visibility"], "a": 1, "exp": "Table 24.8 — with SFC VSBY, the body value is <b>tower</b> visibility; the remark value is the <b>observer's prevailing</b> visibility.", "ref": "FOM Table 24.8"},
{"cat": "METAR/TAF", "q": "The remark <code>WS LDG22</code> indicates:", "o": ["Wind shear detected at 2,200 ft", "An unreliable windsock near runway 22", "Wind shear on landing runway 22"], "a": 2, "exp": "Table 24.8 — <b>WS LDG22 = wind shear, landing runway 22</b>.", "ref": "FOM Table 24.8"},
{"cat": "METAR/TAF", "q": "A 5-digit remarks group beginning with <code>2</code>, sent on the 00Z, 06Z, 12Z and 18Z observations, reports the:", "o": ["Minimum temperature during the last 6 hours", "Maximum temperature during the last 6 hours", "Minimum temperature during the last 24 hours"], "a": 0, "exp": "Table 24.9 — leading <b>2 = 6-hour minimum</b>; leading 1 = 6-hour maximum; tenths of °C.", "ref": "FOM Table 24.9"},
{"cat": "METAR/TAF", "q": "Snow depth on the ground (the <code>4/</code> group) is reported on which observations?", "o": ["Every hourly observation while snow falls", "06Z and 18Z", "0000Z and 1200Z"], "a": 2, "exp": "Table 24.9 — snow depth on the <b>0000Z and 1200Z</b> observations.", "ref": "FOM Table 24.9"},
{"cat": "METAR/TAF", "q": "A remarks group beginning with <code>6</code> on the 03Z, 09Z, 15Z or 21Z observation covers precipitation for the last:", "o": ["6 hours", "3 hours", "24 hours"], "a": 1, "exp": "Table 24.9 — the 6-group covers 6 hours on 00/06/12/18Z but only <b>3 hours on 03/09/15/21Z</b> observations. Leading 7 = 24-hour total.", "ref": "FOM Table 24.9"},
{"cat": "METAR/TAF", "q": "The remark <code>P0000</code> indicates:", "o": ["A trace of precipitation fell during the past hour", "No precipitation expected this forecast period", "The precipitation sensor is inoperative"], "a": 0, "exp": "Table 24.8 — P-group = hourly precip in hundredths of an inch; <b>P0000 = trace</b>.", "ref": "FOM Table 24.8"},
{"cat": "METAR/TAF", "q": "The AWOS-3 VHF radio broadcast may be used as a weather source only when ________, and it updates every ________.", "o": ["the field is IFR / 20 minutes", "no control tower is in operation / one minute", "dispatch requests it / five minutes"], "a": 1, "exp": "FOM 24.1.6 — AWOS-3 VHF broadcast: <b>only with no operating control tower; one-minute updates</b>; frequency in the Jepp approach-plate comm block. Tower operating → tower visibility controls.", "ref": "FOM 24.1.6"},
{"cat": "METAR/TAF", "q": "Which systems are NOT authorized as a weather source unless supplemented by a manual observation?", "o": ["ASOS and AWOS-3", "ATIS and FSS observations", "AWOS-A, AWOS-1, AWOS-2, AMOS, and AUTOB"], "a": 2, "exp": "FOM 24.1.6 — <b>AWOS-A/-1/-2, AMOS, AUTOB</b> need a manual supplement (wind, temp, vis, altimeter, ceiling if required). ASOS and AWOS-3 stand alone.", "ref": "FOM 24.1.6"},
{"cat": "METAR/TAF", "q": "A surface observation is unusable if it is missing visibility, wind, temperature, ceiling (when required), or the ________ — unless the published approach lists an alternate source.", "o": ["altimeter setting", "dew point", "sea level pressure"], "a": 0, "exp": "FOM 24.1.6 — the <b>altimeter setting</b> is required unless the instrument approach procedure lists an alternate source for it.", "ref": "FOM 24.1.6"},
{"cat": "METAR/TAF", "q": "A Center Weather Advisory (CWA) is:", "o": ["A scheduled 6-hour forecast from the tower", "An unscheduled advisory issued by the National Weather Service ATC Center unit", "A pilot-initiated SIGMET request"], "a": 1, "exp": "FOM 24.2.1 — CWA = <b>unscheduled</b>, from the <b>NWS ATC Center unit</b>; supplements or precedes SIGMETs/Convective SIGMETs/area forecasts.", "ref": "FOM 24.2.1"},
{"cat": "METAR/TAF", "q": "The Low Level Wind Shear Alert System (LLWAS) is:", "o": ["A Doppler radar scanning the final approach course", "Tower-mounted anemometers at three levels", "An array of 6 to 30 wind sensors alerting the control tower when shear between sensors exceeds a set level"], "a": 2, "exp": "FOM 24.2.1 — <b>6–30 wind sensors</b>; installation noted on the JeppFD-Pro airport diagram page (##-9A, under General).", "ref": "FOM 24.2.1"},

// Weights
{cat:"Weights",q:"MZFW minus OEW equals:",o:["Maximum ramp weight","Maximum payload","Maximum fuel load"],a:1,exp:"<b>Max payload = MZFW − OEW.</b> The structural zero-fuel limit minus the empty operating weight is exactly how much payload you may load.",ref:"Ref 06 §1"},
{cat:"Weights",q:"ZFW = ________ + ________",o:["OEW + payload","OEW + usable fuel","Payload + fuel"],a:0,exp:"<b>ZFW = OEW + payload.</b> Everything except usable fuel. Add fuel and you get ramp/takeoff weight.",ref:"Ref 06 §1"},
{cat:"Weights",q:"EOW plus maximum payload equals:",o:["MTOW","MZFW","Maximum landing weight"],a:1,exp:"Same identity in reverse: <b>EOW + max payload = MZFW</b>. The AA test asks it both directions.",ref:"Ref 06 §1"},
{cat:"Weights",q:"ZFW is best defined as:",o:["Total aircraft weight minus all usable fuel","Empty aircraft with crew only","Takeoff weight minus taxi fuel"],a:0,exp:"ZFW = the whole loaded airplane — minus <b>usable fuel</b>. That's the definition the test quoted verbatim.",ref:"Ref 06 §1"},
{cat:"Weights",q:"MZFW exists as a structural limit primarily to protect:",o:["The landing gear","The wing root from bending loads","The aft pressure bulkhead"],a:1,exp:"Fuel in the wings relieves wing bending. With zero fuel, all lift-vs-fuselage-weight bending concentrates at the <b>wing root</b> — MZFW caps that load.",ref:"Ref 06 §1"},
{cat:"Weights",q:"May a flight be dispatched above max structural takeoff weight if the runway is long enough?",o:["Yes, with captain concurrence","Yes, if landing weight will be legal","No — never"],a:2,exp:"<b>Never.</b> No performance data exists above max structural — the test stressed you cannot take off over max structural weight.",ref:"121.189"},
{cat:"Weights",q:"Burn to destination 9,000 lb. MLW 144,000, structural MTOW 174,200. Max takeoff weight tonight:",o:["174,200","153,000 (MLW + burn)","144,000"],a:1,exp:"Landing-weight-limited: MLW 144,000 + burn 9,000 = <b>153,000</b> — lower than structural MTOW, so it controls.",ref:"121.195"},
// Nav & PBN
{cat:"Nav & PBN",q:"PBN stands for:",o:["Precision-Based Navigation","Performance-Based Navigation","Position Broadcast Network"],a:1,exp:"<b>Performance-Based Navigation</b> — navigation defined by performance requirements, not specific ground stations. Its two branches: RNAV and RNP.",ref:"Ref 06 §2"},
{cat:"Nav & PBN",q:"The key difference between RNP and RNAV is that RNP adds:",o:["Satellite navigation","Onboard performance monitoring and alerting","Ground radar surveillance"],a:1,exp:"<b>RNP = RNAV + onboard monitoring & alerting.</b> The airplane warns the crew when nav accuracy can't be assured. This exact difference is asked on the AA test.",ref:"Ref 06 §2"},
{cat:"Nav & PBN",q:"RNP AR approaches require:",o:["Only a current GPS database","Special FAA authorization, equipment, and crew training","CAT III autoland"],a:1,exp:"<b>AR = Authorization Required</b> — tighter tolerances (to 0.1 NM), curved legs, special approval. Used at terrain-challenged airports.",ref:"Ref 06 §2"},
{cat:"Nav & PBN",q:"ADS-B 'Out' means the aircraft:",o:["Broadcasts its GPS-derived position automatically ~once per second","Receives traffic and weather","Is outside radar coverage"],a:0,exp:"<b>Automatic Dependent Surveillance–Broadcast:</b> Out = transmit position (mandated in most US controlled airspace); In = receive traffic/weather.",ref:"Ref 06 §2"},
{cat:"Nav & PBN",q:"A TCAS RA (Resolution Advisory):",o:["Is advisory only — follow ATC instead","Commands a vertical maneuver the crew must follow, even against ATC","Commands a turn away from traffic"],a:1,exp:"An <b>RA overrides ATC</b> — crews must follow it. TCAS coordinates through both transponders; maneuvers are vertical only.",ref:"Ref 06 §10"},
{cat:"Nav & PBN",q:"Two aircraft converge head-on at FL350. TCAS coordinates so that:",o:["Both climb","One gets CLIMB and the other DESCEND","Both turn right"],a:1,exp:"The two TCAS units talk to each other and issue <b>complementary</b> RAs — one climbs, one descends.",ref:"Ref 06 §10"},
{cat:"Nav & PBN",q:"RVSM airspace runs from:",o:["FL180–FL600","FL290–FL410","FL240–FL350"],a:1,exp:"<b>FL290–FL410 inclusive</b>, with 1,000-ft separation between RVSM-approved aircraft.",ref:"Ref 06 §10"},
{cat:"Nav & PBN",q:"Within RVSM, vertical separation between approved aircraft is:",o:["500 ft","1,000 ft","2,000 ft"],a:1,exp:"That's the point of RVSM: <b>1,000 ft</b> instead of the old 2,000 ft above FL290 — doubling usable flight levels.",ref:"Ref 06 §10"},
{cat:"Nav & PBN",q:"Magnetic variation is:",o:["Compass error from onboard electronics","The angle between true north and magnetic north at a location","Annual drift of the magnetic pole"],a:1,exp:"Variation = <b>angle between true and magnetic north</b>. 'East is least (subtract), West is best (add)' going true→magnetic.",ref:"Ref 06 §6"},
{cat:"Nav & PBN",q:"A SID is:",o:["A published IFR departure procedure","An arrival procedure","A surface movement chart"],a:0,exp:"<b>Standard Instrument Departure</b> — obstacle-safe published routing from runway to the en route structure. STAR is the arrival twin.",ref:"Ref 06 §6"},
{cat:"Nav & PBN",q:"A STAR is:",o:["A departure procedure","A published arrival route from en route to the approach phase","An oceanic track"],a:1,exp:"<b>Standard Terminal Arrival Route</b> — transitions you from the en route structure to the approach environment.",ref:"Ref 06 §6"},
{cat:"Nav & PBN",q:"Long-range NAVIGATION systems include:",o:["VOR/DME and ILS","GPS/GNSS and IRS/INS","ADF and marker beacons"],a:1,exp:"Oceanic/remote ops use <b>GPS/GNSS and inertial (IRS/INS)</b> — self-contained or satellite-based, no ground stations needed.",ref:"Ref 06 §6"},
{cat:"Nav & PBN",q:"Long-range COMMUNICATIONS include:",o:["VHF only","HF, SATCOM, CPDLC","ACARS over VHF only"],a:1,exp:"VHF is line-of-sight (~200 NM). Beyond that: <b>HF radio, satellite voice, and CPDLC datalink</b>.",ref:"Ref 06 §6"},
