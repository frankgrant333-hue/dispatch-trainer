// ---- FAR fill-in-the-blank: pick the exact missing verbiage ----
{cat:"FARs",q:"FILL THE BLANK — 121.99: the communication link must provide '________ communications' between each airplane and the appropriate dispatch office:",o:["'continuous and secure'","'reliable and rapid'","'direct and immediate'"],a:1,exp:"<b>'Reliable and rapid'</b> — the exact words the test blanks out. Over the ENTIRE route.",ref:"121.99"},
{cat:"FARs",q:"FILL THE BLANK — 121.599: 'No aircraft dispatcher may release a flight unless he is ________ with reported and forecast weather conditions on the route to be flown':",o:["'thoroughly familiar'","'generally acquainted'","'fully briefed'"],a:0,exp:"<b>'Thoroughly familiar'</b> — verbatim. Reported AND forecast, on the route to be flown.",ref:"121.599"},
{cat:"FARs",q:"FILL THE BLANK — 121.629(b): 'No person may take off an aircraft when frost, ice, or snow is ________ the wings, control surfaces, propellers, engine inlets…':",o:["'accumulating near'","'forecast to contact'","'adhering to'"],a:2,exp:"<b>'Adhering to'</b> — the clean-aircraft concept in one word.",ref:"121.629"},
{cat:"FARs",q:"FILL THE BLANK — 121.663: 'The aircraft dispatcher may delegate authority to ________ a release… but he may not delegate his authority to ________':",o:["'amend / cancel'","'sign / dispatch'","'issue / revoke'"],a:1,exp:"<b>Sign / dispatch</b> — Frank's highlighted line; the test blanks exactly these two words.",ref:"121.663"},
{cat:"FARs",q:"FILL THE BLANK — 121.639: fuel to destination, 'thereafter, to fly to and land at the ________ alternate airport… thereafter, to fly for ________ minutes at normal cruising fuel consumption':",o:["'most distant / 45'","'nearest / 30'","'primary / 60'"],a:0,exp:"<b>Most distant / 45 minutes</b> — the domestic fuel rule, word for word.",ref:"121.639"},
{cat:"FARs",q:"FILL THE BLANK — 121.465: scheduled for 'no more than ________ consecutive hours of duty' and relieved of all duty 'for at least ________ consecutive hours during any 7 consecutive days':",o:["'8 / 48'","'12 / 36'","'10 / 24'"],a:2,exp:"<b>10 hours duty / 24-in-7 relief</b> (and 8 hours rest if duty runs past 10 in a 24-hour span).",ref:"121.465"},
{cat:"FARs",q:"FILL THE BLANK — 121.617: takeoff alternate required when weather at the departure airport is 'below the ________ minimums in the certificate holder's operations specifications for that airport':",o:["'takeoff'","'landing'","'alternate'"],a:1,exp:"<b>'LANDING' minimums</b> — that's the whole trick of the rule: you can leave but not come back.",ref:"121.617"},
{cat:"FARs",q:"FILL THE BLANK — 121.619: no alternate needed if, 1 hour before to 1 hour after ETA, 'the ceiling will be at least ________ feet above the airport elevation and the visibility will be at least ________ miles':",o:["'2,000 / 3'","'1,000 / 2'","'3,000 / 5'"],a:0,exp:"<b>2,000 and 3</b> — the 1-2-3 rule in its native FAR language.",ref:"121.619"},
{cat:"FARs",q:"FILL THE BLANK — 121.533: 'The pilot in command and the aircraft dispatcher are ________ responsible for the preflight planning, delay, and ________ release of a flight':",o:["'equally / weather'","'separately / fuel'","'jointly / dispatch'"],a:2,exp:"<b>Jointly / dispatch</b> — the two-key principle of domestic operational control.",ref:"121.533"},
{cat:"FARs",q:"FILL THE BLANK — 121.557: emergency-authority deviation report goes 'through the air carrier's operations manager, to the Administrator… within ________ days':",o:["'30'","'10'","'7'"],a:1,exp:"<b>10 days</b> — dispatcher-declared emergencies report through the operations manager.",ref:"121.557"},
{cat:"FARs",q:"FILL THE BLANK — 121.565: land 'at the nearest ________ airport, in point of ________, at which a safe landing can be made':",o:["'suitable / time'","'available / distance'","'company / fuel'"],a:0,exp:"<b>Suitable / time</b> — not the closest in miles; the closest in MINUTES where a safe landing can be made.",ref:"121.565"},
{cat:"FARs",q:"FILL THE BLANK — 121.195(b): a turbojet must come 'to a full stop within ________ of the effective length of the runway':",o:["'70 percent'","'85 percent'","'60 percent'"],a:2,exp:"<b>60 percent</b> for turbojets (70 for turboprops under 121.185).",ref:"121.195(b)"},
{cat:"FARs",q:"FILL THE BLANK — 121.195(d): wet or slippery runways require 'a runway length of at least ________ of the runway length required' by the dry rule:",o:["'150 percent'","'115 percent'","'125 percent'"],a:1,exp:"<b>115 percent</b> — the wet factor stacked on top of the 60% rule.",ref:"121.195(d)"},
{cat:"FARs",q:"FILL THE BLANK — operational control is 'the exercise of authority over ________, ________, ________, or ________ of a flight':",o:["'initiation, continuation, diversion, termination'","'planning, fueling, boarding, departure'","'takeoff, cruise, descent, landing'"],a:0,exp:"<b>All four verbs</b> — in the interest of safety AND the regularity and efficiency of the flight.",ref:"121.533-.537"},
{cat:"FARs",q:"FILL THE BLANK — 121.601: the dispatcher shall provide the PIC 'all available current reports or information on airport conditions and ________ of navigation facilities that may affect the safety of the flight':",o:["'malfunctions'","'closures'","'irregularities'"],a:2,exp:"<b>'Irregularities'</b> — the FAR's word, covering unmonitored NAVAIDs, outages, and everything between.",ref:"121.601"}
];
const CATS=[["all","🎯 Mixed — everything"],["AA FOM","🅰️ AA FOM — company policy"],["Performance","📈 Performance"],["Weights","⚖️ Weights"],["Weight Chain","🔗 Weight Chain — build-up fill-ins"],["Nav & PBN","🛰 Nav, PBN & RVSM"],["Runways","🛬 Runways & Lighting"],["Approaches","📉 Approaches & Minimums"],["Maps & Codes","🗺 Maps, Centers & Codes"],["Geography","🧭 Airport Geography — locate the network"],["Weather","🌩 Weather"],["METAR/TAF","🌦 METAR/TAF Decoder — FOM deep dive"],["Hazards","⚠️ Weather Hazards — FOM deep dive"],["Systems","🔧 Aero & Systems"],["FARs","📜 FARs"],["Fractions","➗ Fractions"]];
// ---------------- ENGINE ----------------
const app=document.getElementById('app');
let state={};
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function home(){
  let hist='';
  try{const h=JSON.parse(localStorage.getItem('adxhist')||'[]');
    if(h.length)hist='<div class="hist">Recent: '+h.slice(-5).map(x=>`${x.m} ${x.s}/${x.n}`).join(' · ')+'</div>';
  }catch(e){}
  app.innerHTML=`<div class="card">
    <p style="margin-bottom:12px"><b>How it works:</b> pick an answer and the correct one is revealed immediately with a short discussion — then hit Next. 10 questions per round; 8/10 = passing.</p>
    <button class="level" style="background:#7a4a1f;border:1px solid #d98b3d" onclick="startFocus()">🔥 HYPER-FOCUS: Performance & Weights<small>10 straight questions on most people's weakness — and the examiner's favorite area</small></button>
    <p style="margin:10px 0 4px;color:var(--dim);font-size:.85rem">PROGRESSIVE LEVELS</p>
    <button class="level" onclick="start(1)">Level 1 — Fundamentals<small>Definitions, METAR/TAF basics, core FAR recall</small></button>
    <button class="level" onclick="start(2)">Level 2 — Applied<small>Alternate math, fuel calcs, weight limits, RVR conversions</small></button>
    <button class="level" onclick="start(3)">Level 3 — Full Dispatch Scenario<small>Real paperwork package with buried problems — test-level</small></button>
    <p style="margin:14px 0 4px;color:var(--dim);font-size:.85rem">🎓 SUPER SCENARIOS — Denver → JFK, full dispatch problems (weights → charts → decisions)</p>
    ${Object.keys(SUPERS).map(k=>`<button class="level" style="background:#274156;border:1px solid #3e7cb1" onclick="startSuper('${k}')">${SUPERS[k].t}<small>${SUPERS[k].d}</small></button>`).join('')}
    <p style="margin:14px 0 4px;color:var(--dim);font-size:.85rem">AA REAL-EXAM DRILLS — built from actual hiring-test reports</p>
    ${CATS.map(c=>`<button class="level" onclick="startCat('${c[0]}')">${c[1]}<small>${c[0]==='all'?'10 random questions from the whole AA bank':countCat(c[0])+' questions in this topic'}</small></button>`).join('')}
    ${hist}</div>`;
}
function countCat(c){return AABANK.filter(q=>q.cat===c).length;}
function start(lv){
  let pool=BANK.filter(q=>q.lv===lv),scen=null,qs;
  if(lv===3){const key=shuffle(['s1','s2'])[0];qs=shuffle(pool.filter(q=>q.sc===key)).slice(0,10);scen=key;}
  else qs=shuffle(pool).slice(0,10);
  state={mode:'L'+lv,lv,scen,qs,i:0,score:0,picked:null,done:[]};
  render();
}
function startSuper(k){
  SCEN[k]=SUPERS[k].p;
  const qs=SUPERQS.filter(q=>q.sc===k).map(q=>({topic:'🎓 '+SUPERS[k].t,...q}));
  state={mode:'SUPER-'+k,lv:null,scen:k,qs,i:0,score:0,picked:null,done:[]};
  render();
}
function startCat(cat){
  const pool=cat==='all'?AABANK:AABANK.filter(q=>q.cat===cat);
  const qs=shuffle(pool).slice(0,Math.min(10,pool.length));
  state={mode:cat==='all'?'AA-Mix':'AA-'+cat,lv:null,scen:null,qs,i:0,score:0,picked:null,done:[]};
  render();
}
function startFocus(){
  const pool=AABANK.filter(q=>q.cat==='Performance'||q.cat==='Weights');
  const qs=shuffle(pool).slice(0,10);
  state={mode:'🔥Perf',lv:null,scen:null,qs,i:0,score:0,picked:null,done:[]};
  render();
}
function render(){
  const q=state.qs[state.i],p=state.picked,answered=p!==null;
  const scen=state.scen?`<pre class="paper">${SCEN[state.scen]}</pre>`:'';
  app.innerHTML=`<div class="card">
    <div class="bar"><div style="width:${(state.i+(answered?1:0))/state.qs.length*100}%"></div></div>
    ${state.scen?scen:''}
    <div class="topic">${q.topic||q.cat}${answered?' · '+q.ref:''}</div>
    <div class="qnum">Question ${state.i+1} of ${state.qs.length} — score so far: ${state.score}</div>
    <div class="qtext">${q.q}</div>
    ${q.o.map((o,j)=>{
      let cls='';
      if(answered){if(j===q.a)cls='correct';else if(j===p)cls='wrong';}
      return `<button class="opt ${cls}" ${answered?'style="cursor:default"':''} onclick="pick(${j})">${'ABC'[j]}. ${o}${answered&&j===q.a?' ✔':''}${answered&&j===p&&p!==q.a?' ✘ your answer':''}</button>`;}).join('')}
    ${answered?`<div class="exp"><b>${p===q.a?'✅ Correct.':'❌ Not quite — the answer is '+'ABC'[q.a]+'.'}</b> ${q.exp}</div>
      <div style="margin-top:12px"><button onclick="next()" style="background:#5cb85c">${state.i<state.qs.length-1?'Next Question ▶':'See Final Score ✔'}</button>
      <button onclick="home()" style="background:#33415c">Quit</button></div>`
    :`<div style="margin-top:12px"><button onclick="home()" style="background:#33415c">Quit</button></div>`}
  </div>`;
  window.scrollTo(0,0);
}
function pick(j){
  if(state.picked!==null)return;
  state.picked=j;
  const q=state.qs[state.i];
  if(j===q.a)state.score++;
  state.done.push({q,picked:j});
  render();
}
function next(){
  state.picked=null;state.i++;
  if(state.i>=state.qs.length)finish();else render();
}
function finish(){
  const n=state.qs.length,score=state.score,pass=score>=Math.ceil(n*0.8);
  try{const h=JSON.parse(localStorage.getItem('adxhist')||'[]');h.push({m:state.mode,s:score,n,d:Date.now()});localStorage.setItem('adxhist',JSON.stringify(h));}catch(e){}
  const missed=state.done.filter(d=>d.picked!==d.q.a);
  const rows=missed.map((d,i)=>`<div class="card"><div class="topic">${d.q.topic||d.q.cat} · ${d.q.ref}</div>
      <div class="qtext">${d.q.q}</div>
      ${d.q.o.map((o,j)=>`<div class="opt ${j===d.q.a?'correct':(d.picked===j?'wrong':'')}" style="cursor:default">${'ABC'[j]}. ${o}${j===d.q.a?' ✔':''}${d.picked===j&&d.picked!==d.q.a?' ✘':''}</div>`).join('')}
      <div class="exp">${d.q.exp}</div></div>`).join('');
  const perfMissed=missed.some(d=>['Performance','Weights'].includes(d.q.cat)||['Performance','Weights','W&B'].includes(d.q.topic));
  const focusPrompt=state.mode==='🔥Perf'
    ?`<button onclick="startFocus()" style="background:#7a4a1f">🔥 Another 10 Performance questions</button>`
    :`<div style="margin-top:14px;padding:12px;background:#11203a;border-radius:8px">
       <b>${perfMissed?'You missed performance material this round.':'Want to sharpen the examiner\\u2019s favorite area?'}</b><br>
       <span style="color:var(--dim);font-size:.9rem">Performance & weights is most people's weak spot — and what test examiners focus on most.</span><br>
       <button onclick="startFocus()" style="background:#7a4a1f;margin-top:8px">🔥 Hyper-Focus: 10 straight Performance questions</button></div>`;
  app.innerHTML=`<div class="card" style="text-align:center">
    <div class="score ${pass?'pass':'fail'}">${score} / ${n}</div>
    <p>${pass?'✅ Passing — nice work.':'📚 Below '+Math.ceil(n*0.8)+'/'+n+' — review your misses below, then retry.'}</p>
    <button onclick="${state.lv?`start(${state.lv})`:'home()'}">Retry</button>
    ${pass&&state.lv&&state.lv<3?`<button onclick="start(${state.lv+1})">Level ${state.lv+1} ▶</button>`:''}
    <button onclick="home()" style="background:#33415c">Menu</button>
    ${focusPrompt}</div>
    ${missed.length?`<h1 style="font-size:1.1rem;margin:10px 0">Review your ${missed.length} miss${missed.length>1?'es':''}</h1>${rows}`:'<div class="card">Perfect round — nothing to review. 🎉</div>'}`;
  window.scrollTo(0,0);
}
window.start=start;window.startCat=startCat;window.startFocus=startFocus;window.startSuper=startSuper;window.pick=pick;window.next=next;window.home=home;
home();
</script>
